openapi: 3.1.0

info:
  title: Purpose Source Network — public read API
  version: 1.0.1
  summary: Keyless, unauthenticated read access to every published artifact of the Purpose Source Network.
  description: |
    Every route here is **unauthenticated, keyless and CORS-open for GET**. There is no
    API key to request, no account to create, and no rate plan to negotiate — an OSPO or
    an SCA scanner can consume this API the way it consumes a static file, because that is
    essentially what it is.

    ## The one architectural rule

    These endpoints serve **only published artifacts**. The workers behind them hold no
    database path by construction, which is what makes the public surface cost almost
    nothing at idle and shrug at a hundredfold traffic spike. Freshness is therefore
    **eventually consistent by design**: the published propagation bound for
    coverage-relevant state is five minutes worldwide, and nothing here promises real
    time.

    Every artifact response carries an `ETag` and a `Last-Modified` equal to the
    artifact's own `generatedAt`, and honours `If-None-Match` with `304`. Polling with
    `If-None-Match` is the intended usage pattern, not an abuse of it.

    ## Errors

    Every failure answers with the same envelope and a stable, lowercase machine `code`:

    ```json
    { "error": { "code": "repo_not_registered", "message": "…", "traceId": "…" } }
    ```

    Codes are additive-only. A breaking change means a new versioned URL, never an
    in-place mutation of this one.

    ## Phase availability

    Not every route is live yet. Each operation carries `x-psn-phase`:

    - `P-M2` — live in the first public version.
    - `P-M3` — the computed coverage endpoint. At P-M2 the coverage proof is the
      published entitlement JWS plus the human verify page; the endpoint activates later
      with no schema change.
    - `P-M4` — the change feed and the sandbox tenant, both demand-gated.

    ## Machine-readable schemas

    Every artifact body is described by a JSON Schema published alongside this document
    at `https://purposesource.org/spec/schemas/`. The schemas are the authority on
    artifact content; this document is the authority on routes, status codes and caching.

    ## Apex aliases

    A few canonical endpoints are also mounted on the apex domain by the same worker:
    `/registry.json` (the bulk registry export), `/transparency.json` (the latest ledger
    export), `/schedule.json` (the current fee-schedule version), `/stats.json`,
    `/jwks.json` and `/ct/*`. They serve byte-identical bodies.
  contact:
    name: Purpose Source Network
    url: https://purposesource.org/trust/api
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: https://api.purposesource.org
    description: Production. The only production host.

# Deliberately empty: every route is unauthenticated and keyless. There is no scheme to
# declare because there is nothing to authenticate — an OSPO consumes this API the way it
# consumes a static file. Stated explicitly rather than omitted, so a reader can tell the
# difference between "no security" and "security we forgot to document".
security: []

tags:
  - name: coverage
    description: The coverage answer — is this organisation covered for this repository?
  - name: certificates
    description: Certificate verification and the transparency log.
  - name: keys
    description: Signing-key publication (JWKS).
  - name: registry
    description: The registry of adopting repositories.
  - name: entitlements
    description: Signed organisation entitlement records.
  - name: ledger
    description: The append-only allocation ledger and its hash chain.
  - name: badges
    description: README badge endpoints in the shields.io endpoint format.
  - name: counters
    description: Public counters, with an explicit state machine so an absent number is a documented state.
  - name: changes
    description: The change-event feed — the sync primitive for integrators.
  - name: forms
    description: No-storage intake routes for contact, abuse and data-subject requests.
  - name: meta
    description: Deployment self-description and diagnostics.

paths:
  /v1/coverage:
    get:
      operationId: getCoverage
      summary: Coverage answer for an organisation and a repository
      description: |
        Answers with one of exactly eight values, plus a `basis` block naming what
        produced the answer and a `proof` pointing at the signed artifact that backs it.

        **GET accepts an opaque company ULID only.** A domain in the `company` parameter
        is rejected with `invalid_company_ref`, because a third-party organisation's
        identifier must never appear in a shareable, CDN-cached, log-visible URL. Use
        `POST` for a domain-keyed lookup.

        Absence of a record for the organisation is `no`, never an error — legibility for
        scanners matters more than a pedantic 404. An unregistered *repository*, by
        contrast, is `repo_not_registered`: the question cannot be asked about a
        repository that never adopted.

        The answer is computed by a published, versioned pure function (`cov-v1`) over
        three signed or published inputs. Its source and its frozen test vectors are in
        the same repository as this document, and the running deployment publishes its own
        module digest at `/v1/meta` — so the code that answered your query is checkable
        against the code we published.
      tags: [coverage]
      x-psn-phase: P-M3
      parameters:
        - name: company
          in: query
          required: true
          description: The organisation's platform ULID. A domain here is `invalid_company_ref` — use POST.
          schema:
            type: string
            pattern: '^co_[0-9abcdefghjkmnpqrstvwxyz]{26}$'
          example: co_01jf8w2c9km3q7xz5r0v4t6y8b
        - name: repo
          in: query
          required: true
          description: The repository's GitHub node id. Names and owners are display caches and are not accepted.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{4,128}$'
          example: R_kgDOAbc123
      responses:
        '200':
          description: The coverage answer. Edge-cached for 300 s and purged on every entitlement or waiver publish batch.
          headers:
            Cache-Control:
              description: Edge cache policy for this route.
              schema:
                type: string
              example: public, s-maxage=300
            ETag:
              description: Strong validator. Send it back as `If-None-Match`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageResponse'
              examples:
                yesViaPass:
                  summary: Covered by an active Pass
                  value:
                    answer: yes-via-pass
                    basis:
                      algoVersion: cov-v1
                      company:
                        coId: co_01jf8w2c9km3q7xz5r0v4t6y8b
                        verification: domain-verified
                      repo:
                        nodeId: R_kgDOAbc123
                        repoState: verified
                      entitlement:
                        entId: ent_01jf8w2c9km3q7xz5r0v4t6y9b
                        lane: pass
                        periodStart: '2027-01-01T00:00:00Z'
                        periodEnd: '2028-01-01T00:00:00Z'
                    asOf: '2027-06-01T12:00:00Z'
                    proof:
                      type: entitlement-jws
                      url: https://api.purposesource.org/v1/entitlements/co_01jf8w2c9km3q7xz5r0v4t6y8b.jws
                      sha256: b1946ac92492d2347c6235b4d2611184b1946ac92492d2347c6235b4d2611184
                lapsedInGrace:
                  summary: Term ended, inside the 30-day grace window
                  value:
                    answer: lapsed-in-grace
                    basis:
                      algoVersion: cov-v1
                      company:
                        coId: co_01jr7f1n8wx2a6gj4b9e3c5h7m
                        verification: officer-attested
                      repo:
                        nodeId: R_kgDOAbc123
                        repoState: verified
                      entitlement:
                        entId: ent_01jn4c8j5st9x3df1y6b0z2e5h
                        lane: project
                    asOf: '2027-06-01T12:00:00Z'
                    dates:
                      periodEnd: '2027-05-15T00:00:00Z'
                      graceEnd: '2027-06-14T00:00:00Z'
                    proof:
                      type: entitlement-jws
                      url: https://api.purposesource.org/v1/entitlements/co_01jr7f1n8wx2a6gj4b9e3c5h7m.jws
                      sha256: b1946ac92492d2347c6235b4d2611184b1946ac92492d2347c6235b4d2611184
                underThreshold:
                  summary: Under the licence threshold — no entitlement required
                  value:
                    answer: no-entitlement-required-under-threshold
                    basis:
                      algoVersion: cov-v1
                      company:
                        coId: co_01jn4c8j5st9x3df1y6b0z2e4h
                        verification: officer-attested
                      repo:
                        nodeId: R_kgDOAbc123
                        repoState: verified
                    asOf: '2027-06-01T12:00:00Z'
                    dates:
                      selfCertifiedAt: '2027-03-10T09:00:00Z'
                    proof:
                      type: entitlement-jws
                      url: https://api.purposesource.org/v1/entitlements/co_01jn4c8j5st9x3df1y6b0z2e4h.jws
                yesViaWaiver:
                  summary: Covered by a gratis waiver granted by the project admin
                  value:
                    answer: yes-via-waiver
                    basis:
                      algoVersion: cov-v1
                      company:
                        coId: co_01jk2a6g3qr7v1bd9w4z8x0c2f
                        verification: unverified
                      repo:
                        nodeId: R_kgDOAbc123
                        repoState: verified
                      waiver:
                        wvrId: wvr_01jk2a6g3qr7v1bd9w4z8x0c3f
                        grantedAt: '2027-04-01T00:00:00Z'
                    asOf: '2027-06-01T12:00:00Z'
                    proof:
                      type: waiver-record
                      url: https://api.purposesource.org/v1/waivers/R_kgDOAbc123.json#wvr_01jk2a6g3qr7v1bd9w4z8x0c3f
                noRecord:
                  summary: No record for this organisation — `no`, and no proof
                  value:
                    answer: no
                    basis:
                      algoVersion: cov-v1
                      company: null
                      note: no registry record for this organization
                      repo:
                        nodeId: R_kgDOAbc123
                        repoState: verified
                    asOf: '2027-06-01T12:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'
    post:
      operationId: postCoverage
      summary: Coverage answer, accepting a verified domain
      description: |
        Identical semantics and identical response schema to the GET form. It exists for
        one reason: a domain-keyed lookup must not travel in a URL. POST bodies are not
        cached, not shared in links, and not written to access logs the way query strings
        are.

        `company` accepts either a platform ULID or a domain that has been
        **domain-verified** for exactly one organisation. A domain mapping to more than
        one organisation answers `company_ambiguous` and lists nothing — the caller must
        use a ULID.

        Never cached. It computes from the same cached artifacts the GET form uses, so it
        costs the same.
      tags: [coverage]
      x-psn-phase: P-M3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [company, repo]
              properties:
                company:
                  type: string
                  maxLength: 253
                  description: A `co_` ULID or a verified domain.
                repo:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{4,128}$'
                  description: The repository's GitHub node id.
            examples:
              byDomain:
                summary: Domain-keyed lookup
                value:
                  company: example.com
                  repo: R_kgDOAbc123
      responses:
        '200':
          description: The coverage answer. Never cached.
          headers:
            Cache-Control:
              description: POST responses are never cached.
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageResponse'
              examples:
                yesViaProject:
                  summary: Covered by a Project term that declared this repository
                  value:
                    answer: yes-via-project
                    basis:
                      algoVersion: cov-v1
                      company:
                        coId: co_01jh0y4e1np5s9zb7t2x6v8a0d
                        verification: domain-verified
                      repo:
                        nodeId: R_kgDOAbc123
                        repoState: verified
                      entitlement:
                        entId: ent_01jh0y4e1np5s9zb7t2x6v8a1d
                        lane: project
                        periodStart: '2027-03-20T00:00:00Z'
                        periodEnd: '2028-03-19T00:00:00Z'
                    asOf: '2027-06-01T12:00:00Z'
                    proof:
                      type: entitlement-jws
                      url: https://api.purposesource.org/v1/entitlements/co_01jh0y4e1np5s9zb7t2x6v8a0d.jws
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

  /v1/verify/{certId}:
    get:
      operationId: getCertificateRecord
      summary: Verify record for one certificate
      description: |
        Passthrough of the published certificate record. The human verify page is the
        canonical place a certificate is checked; this route serves the same artifact to
        machines.

        Read the `ct` block carefully. A certificate whose signature verifies while its
        hash is **absent** from the transparency log must be treated as UNVERIFIED, not as
        a soft warning — that absence is exactly what a rogue issuance looks like. `ct:
        null` means signed-but-not-yet-logged.

        The record never contains more subject data than the certificate itself displays.
        Individual-subject records are unlisted: reachable only by their unguessable id,
        excluded from every index and sitemap, and served with `X-Robots-Tag: noindex`.
      tags: [certificates]
      x-psn-phase: P-M2
      parameters:
        - name: certId
          in: path
          required: true
          description: Certificate id — a prefixed ULID, non-guessable by construction.
          schema:
            type: string
            pattern: '^cert_[0-9abcdefghjkmnpqrstvwxyz]{26}$'
          example: cert_01jf8w2c9km3q7xz5r0v4t6y8a
      responses:
        '200':
          description: The certificate record. Cached 300 s, purged on issue and on revocation.
          headers:
            X-Robots-Tag:
              description: Individual-subject records are never indexed.
              schema:
                type: string
              example: noindex
            ETag:
              description: Strong validator.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/certificate-record.v1.json'
              examples:
                revoked:
                  summary: A revoked corporate supporter certificate
                  value:
                    schemaVersion: 1
                    generatedAt: '2027-03-02T10:00:00Z'
                    cid: cert_01jf8w2c9km3q7xz5r0v4t6y8a
                    status: revoked
                    typ: supporter
                    variant: entitlement
                    sub: Example Industries AG
                    scope:
                      kind: project
                      repos: [R_kgDOAbc123]
                    band: 10-100M
                    period:
                      validFrom: '2027-01-01'
                      validUntil: '2027-12-31'
                    issuedAt: '2027-01-01T09:00:00Z'
                    kid: psn-prod-2027-1
                    ct:
                      seq: 118234
                      segment: 11
                    revocation:
                      reasonClass: project-delisting
                      at: '2027-03-01T12:00:00Z'
                    supersedes: null
                    supersededBy: null
                    verifyUrl: https://purposesource.org/verify/cert_01jf8w2c9km3q7xz5r0v4t6y8a
                    jws: eyJhbGciOiJFUzI1NiIsImtpZCI6InBzbi1wcm9kLTIwMjctMSJ9.eyJjaWQiOiJjZXJ0XzAxamY4dzJjOWttM3E3eHo1cjB2NHQ2eThhIn0.MEUCIQDexampleSignatureBytesHereOnlyForDocumentation
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

  /jwks.json:
    get:
      operationId: getJwks
      summary: Production signing keys (JWKS)
      description: |
        The production key set. Retired keys **stay here forever** with their validity
        windows, so a certificate issued years ago still verifies — key rotation must never
        invalidate what it signed.

        The same key set is committed to this contract repository with signed commits, so
        substituting keys on the website alone cannot forge trust. If the two copies
        disagree, do not trust either: say so publicly.

        Sandbox keys are a **disjoint set** published only at the sandbox path. A
        production route refuses sandbox key material outright.
      tags: [keys]
      x-psn-phase: P-M2
      responses:
        '200':
          description: The key set. Cached 3600 s, purged on rotation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
              examples:
                oneActiveKey:
                  summary: One active key, one retired
                  value:
                    schemaVersion: 1
                    generatedAt: '2027-01-01T00:05:00Z'
                    keys:
                      - kty: EC
                        crv: P-256
                        x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                        y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
                        kid: psn-prod-2027-1
                        use: sig
                        alg: ES256
                        "psn:status": active
                        "psn:validityWindow":
                          notBefore: '2027-01-01T00:00:00Z'
                          notAfter: null
                      - kty: EC
                        crv: P-256
                        x: MKBCTNIcKUSDii11ySs3526iDZ8AiTo7Tu6KPAqv7D4
                        y: 4Etl6SRW2YiLUrN5vfvVHuhp7x8PxltmWWlbbM4IFyM
                        kid: psn-prod-2026-1
                        use: sig
                        alg: ES256
                        "psn:status": retired
                        "psn:validityWindow":
                          notBefore: '2026-01-01T00:00:00Z'
                          notAfter: '2027-01-01T00:00:00Z'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

  /sandbox/jwks.json:
    get:
      operationId: getSandboxJwks
      summary: Sandbox signing keys (JWKS) — never production
      description: |
        The integrator test-mode key set, documented as non-production. Sandbox
        certificates sign with these keys, are marked as sandbox in every response body
        and header, and **never enter the transparency log**. No route ever merges this
        set with the production set.
      tags: [keys]
      x-psn-phase: P-M4
      responses:
        '200':
          description: The sandbox key set. Cached 3600 s.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
              examples:
                sandboxMarked:
                  summary: The test-mode set, marked in the body
                  value:
                    schemaVersion: 1
                    generatedAt: '2027-06-01T05:00:00Z'
                    sandbox: true
                    keys:
                      - kty: EC
                        crv: P-256
                        x: gI0GAILBdu7T53akrFmMyGcsF3n5dO7MmwNBHKW5SV0
                        y: SLW_xSffzlPWrHEVI30DHM_4egVwt3NQqeUD7nMFpps
                        kid: psn-sandbox-2026-1
                        use: sig
                        alg: ES256
                        "psn:status": active
                        "psn:validityWindow":
                          notBefore: '2026-01-01T00:00:00Z'
                          notAfter: null
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

  /badge/{nodeId}.json:
    get:
      operationId: getBadge
      summary: README badge (shields.io endpoint format)
      description: |
        The body a shields.io endpoint badge renders.

        Two behaviours are deliberate and may look odd from the outside. First, an
        **unknown repository answers 200**, with `isError: true` and the message "not
        registered" — shields renders errors from bodies, not from status codes, so a 404
        here would show a reader nothing at all. Second, a **suspended, quit or delisted**
        repository renders the neutral form: a stale cached badge must never keep
        asserting registration, so the worker serves neutral whenever the registry index
        contradicts the cached artifact.

        No money figure appears on any badge before real money has moved.
      tags: [badges]
      x-psn-phase: P-M2
      parameters:
        - name: nodeId
          in: path
          required: true
          description: The repository's GitHub node id.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]{4,128}$'
          example: R_kgDOAbc123
      responses:
        '200':
          description: |
            The badge body — including for an unknown repository, which returns the
            error-shaped body at 200. Cached 3600 s, stale-while-revalidate 24 h,
            stale-if-error 7 days.
          content:
            application/json:
              schema:
                $ref: '../schemas/badge.v1.json'
              examples:
                registered:
                  summary: A verified repository
                  value:
                    schemaVersion: 1
                    label: purpose source
                    message: registered
                    color: brightgreen
                    cacheSeconds: 3600
                neutral:
                  summary: Suspended, quit or delisted — never keeps asserting registration
                  value:
                    schemaVersion: 1
                    label: purpose source
                    message: 'status: see registry'
                    color: lightgrey
                    cacheSeconds: 3600
                unknown:
                  summary: Unknown repository — 200 with an error-shaped body
                  value:
                    schemaVersion: 1
                    isError: true
                    label: purpose source
                    message: not registered
                    color: inactive
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: |
            Only when no cached copy exists anywhere. Wherever one does, this route serves
            stale rather than failing — a badge outage on someone's README is our problem,
            not theirs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /stats.json:
    get:
      operationId: getStats
      summary: Public counters
      description: |
        The counters shown on the site, with an explicit three-state machine so that a
        missing number is a documented state rather than a bug.

        In `pre-launch` every numeric field is `null`. In `launched-pre-disbursement` the
        registry counts are real while the money figure stays `null` and
        `firstDisbursementScheduledFor` names the date. Only in `post-first-franc` is the
        money figure a number. "CHF 0" is never rendered — not as an achievement and not
        as an embarrassment.

        `state` is computed from real registry and ledger facts and is never set by hand.
      tags: [counters]
      x-psn-phase: P-M2
      responses:
        '200':
          description: The counters. Regenerated daily, cached 3600 s.
          content:
            application/json:
              schema:
                $ref: '../schemas/stats.v1.json'
              examples:
                preLaunch:
                  summary: Before launch — mechanism copy only
                  value:
                    schemaVersion: 1
                    generatedAt: '2026-09-01T05:00:00Z'
                    state: pre-launch
                    projectsRegistered: null
                    contributorsClaimed: null
                    companiesCovered: null
                    chfRoutedMinor: null
                    cur: CHF
                    firstDisbursementScheduledFor: null
                    loi: null
                    detectedUnclaimed: null
                    smallnessThresholds:
                      projects: 25
                      contributors: 50
                      companies: 10
                launched:
                  summary: Launched, before the first disbursement
                  value:
                    schemaVersion: 1
                    generatedAt: '2027-04-01T05:00:00Z'
                    state: launched-pre-disbursement
                    projectsRegistered: 12
                    contributorsClaimed: null
                    companiesCovered: 6
                    chfRoutedMinor: null
                    cur: CHF
                    firstDisbursementScheduledFor: '2027-07-15'
                    loi: null
                    detectedUnclaimed: 3
                    smallnessThresholds:
                      projects: 25
                      contributors: 50
                      companies: 10
                    links:
                      registry: https://purposesource.org/registry
                      ledger: https://purposesource.org/ledger
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

  /v1/meta:
    get:
      operationId: getMeta
      summary: Deployment self-description
      description: |
        What this deployment is running. Two fields matter to an auditor: the coverage
        module's digest, which must equal the digest of the published reference
        implementation, and the answer enumeration, which must be exactly the eight frozen
        values.

        Continuous integration checks the first equality on every deploy. This endpoint
        lets anybody else check it too, at any time, without asking us.
      tags: [meta]
      x-psn-phase: P-M2
      responses:
        '200':
          description: The deployment's own description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
              examples:
                deployed:
                  summary: A production deployment
                  value:
                    edgeVersion: 2027.06.01-3
                    coverage:
                      algoVersion: cov-v1
                      moduleSha256: 3b1c9e0a5d7f2846bb14c0e9a7d3f5028c6b4a19e7d2f80315a9c4b6e8d0f2a4
                    contracts:
                      answerEnum:
                        - yes-via-pass
                        - yes-via-project
                        - yes-via-portfolio
