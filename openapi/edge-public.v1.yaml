                        grantLetterAcceptedOn: '2026-11-30'
                        standard:
                          accountsYears: 5
                          accountsRef: SAMPLE-ACCOUNTS-ZYJZ8XJH-2023-2025
                          foreignReceiptEvidence: SAMPLE — evidence that a Swiss association may lawfully transfer to this organisation under the law of PE
                          independenceDeclared: true
                          bankTransferOnly: true
                          grantLetterRef: SAMPLE-GRANT-LETTER-ZYJZ8XJH
                          annualStatementRef: SAMPLE-ANNUAL-REPORT-ZYJZ8XJH-2025
                        activeFrom: 2027-01
                        sample: true
                    shareRule:
                      mode: equal-per-recipient-in-category
                      rounding: largest-remainder
                      tiebreak: list-order
                      status: decided
                      note: 'Decided (ops decision D40 item 7): what a category receives for the month, so far as it does not go to a named active recipient, goes in equal shares to every active listed recipient of the category, apportioned by largest remainder with ties broken by the order of this list (ascending recipientId), so the shares sum exactly to the category''s amount. An organisation removed at once under statutes Art. 7(6) has no share from then on, and its share for that month goes to the other active recipients of its category, except after a sanctions hit.'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

  /v1/designations/{month}.json:
    get:
      operationId: getDesignationsSummary
      summary: The designations in force for one month, in summary
      description: |
        The registry-wide summary of the designations in force for one month (statutes
        Art. 8(4): designations are advisory, recorded and published in summary; Annex C,
        the Calculation Rules, Nr. 26): the totals over all repositories of the projects'
        own designations and, behind a floor, of the contributors' designations, each with
        its count of designations. Every figure is a sum of whole percents, so in each half
        the totals in `categories` and `association` make exactly 100 times
        `designations`, and a mean is a total divided by `designations`. Each repository's
        own statements are in its record.

        Re-rendered on every run of the platform's index build for the plane's month, the
        UTC calendar month of the run's `generatedAt`: within its month the document
        changes from run to run, and its `ETag` and `Last-Modified` with it. A past month's
        document stays as it was last rendered. A month no run rendered has no document
        and answers `404`; nothing is back-filled.

        `projects` is always present. The contributors' half, `contributors`, is absent
        below the floor: it is present only when at least 5 distinct contributors have a
        designation in force for the month over all repositories, and the designations of
        repositories below their own floor of 5 designators, which no repository summary
        covers, are none or are held by at least 5 distinct contributors. The schema states
        the rule in full. The number of distinct contributors is never published.
        Contributors' designations are advisory and route money only after the fairness
        review (D27).

        It names no person: no repository, contributor, administrator, account, node id,
        version or instant is published, and every object is closed, so no member can
        carry one.

        Cached 300 s, like the allocation keys: the document changes within its month, and
        a month asked for before its first run is not held as `404` for longer than that.
      tags: [designations]
      x-psn-phase: P-M3
      parameters:
        - name: month
          in: path
          required: true
          description: The month the designations are in force for, `YYYY-MM`.
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: 2026-11
      responses:
        '200':
          description: The month's summary. Cached 300 s.
          content:
            application/json:
              schema:
                $ref: '../schemas/designations-summary.v1.json'
              examples:
                withContributors:
                  summary: A month with both halves, the contributors' at or above the floor (development plane)
                  value:
                    schemaVersion: 1
                    generatedAt: '2026-11-02T05:00:00Z'
                    source: fixture
                    month: 2026-11
                    projects:
                      designations: 3
                      categories:
                        health: 50
                        education: 30
                        environment: 60
                        research: 100
                      association: 60
                    contributors:
                      designations: 14
                      categories:
                        health: 420
                        education: 260
                        environment: 350
                        animal-welfare: 90
                      association: 280
                belowFloor:
                  summary: A month below the floor, the contributors' half absent (sample plane)
                  value:
                    schemaVersion: 1
                    generatedAt: '2026-10-27T09:00:00Z'
                    source: sample
                    month: 2026-10
                    projects:
                      designations: 2
                      categories:
                        health: 100
                        education: 30
                        environment: 50
                      association: 20
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

  /ct/latest.json:
    get:
      operationId: getCtLatest
      summary: The open transparency-log segment
      description: |
        The current, still-growing segment of the certificate transparency log. Entries
        carry a hash, a type, a kind, a reference and a timestamp — and nothing else. No
        names, no email addresses, no subject data. That is what lets the log be immutable
        forever, including through an erasure request.

        A revocation is a **new entry** whose `ref` is the original entry's hash. The log
        never edits.
      tags: [certificates]
      x-psn-phase: P-M2
      responses:
        '200':
          description: The open segment. Cached 300 s.
          content:
            application/json:
              schema:
                $ref: '../schemas/ct-segment.v1.json'
              examples:
                openSegment:
                  summary: Segment 0, one issue entry and its revocation
                  value:
                    schemaVersion: 1
                    segment: 0
                    startSeq: 0
                    prevSegmentSha256: null
                    generatedAt: '2027-06-01T06:00:00Z'
                    closed: false
                    entries:
                      - seq: 0
                        h: 5c1a8f3e2d0b9c7a6e5d4f3b2a1908675c1a8f3e2d0b9c7a6e5d4f3b2a190867
                        typ: supporter
                        kind: issue
                        ref: null
                        ts: '2027-03-01T09:00:00Z'
                      - seq: 1
                        h: 7e2b9d0c1a8f3e5d4c3b2a19087665447e2b9d0c1a8f3e5d4c3b2a1908766544
                        typ: supporter
                        kind: revoke
                        ref: 5c1a8f3e2d0b9c7a6e5d4f3b2a1908675c1a8f3e2d0b9c7a6e5d4f3b2a190867
                        ts: '2027-03-01T12:00:00Z'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

  /ct/{segment}.json:
    get:
      operationId: getCtSegment
      summary: One closed transparency-log segment
      description: |
        A frozen segment, chained to its predecessor by hash. Closed segments are cached
        for a day because they can never change.
      tags: [certificates]
      x-psn-phase: P-M2
      parameters:
        - name: segment
          in: path
          required: true
          description: Segment number. Segment 0 is the first, and is carried forward across every platform generation.
          schema:
            type: integer
            minimum: 0
          example: 0
      responses:
        '200':
          description: The segment. Cached 86400 s.
          content:
            application/json:
              schema:
                $ref: '../schemas/ct-segment.v1.json'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

  /ct/checkpoint-latest.json:
    get:
      operationId: getCtCheckpoint
      summary: Latest signed transparency-log checkpoint
      description: |
        A signed commitment to the log's head, which is what makes retroactive tampering
        provable rather than merely unlikely. Published monthly, signed with the same keys
        as certificates, and mirrored into a public git repository that Software Heritage
        archives. The repository's commit dates are ours: the mirror's own workflow
        writes them, so they prove nothing about time. Software Heritage's visit date,
        the moment its archive fetched the repository, is the independent clock, and the
        mirror records it beside each checkpoint.
      tags: [certificates]
      x-psn-phase: P-M2
      responses:
        '200':
          description: The checkpoint, as a compact JWS plus its decoded payload for convenience. Verify the signature, not the convenience copy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CtCheckpointArtifact'
              examples:
                checkpoint:
                  summary: A monthly checkpoint
                  value:
                    schemaVersion: 1
                    generatedAt: '2027-07-01T00:05:00Z'
                    jws: eyJhbGciOiJFUzI1NiIsImtpZCI6InBzbi1wcm9kLTIwMjctMSJ9.eyJhc09mIjoiMjAyNy0wNy0wMVQwMDowMDowMFoifQ.MEUCIQDexampleSignatureBytesHereOnlyForDocumentation
                    payload:
                      asOf: '2027-07-01T00:00:00Z'
                      headSeq: 1
                      headSegment: 0
                      headSegmentSha256: 9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d
                      kid: psn-prod-2027-1
                      iss: https://api.purposesource.org
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

  /v1/changes:
    get:
      operationId: getChanges
      summary: Change-event feed
      description: |
        The sync primitive: registry state transitions in event form, so an integrator can
        stay current without polling every artifact.

        `cursor` is the last event id you saw; omit it to start from the oldest. `next` is
        **always present**, even when `items` is empty, so a caught-up poller idles on
        cheap conditional requests rather than on empty pages.

        Personal data: none. Every payload field is public registry state, which is a
        property of the event catalogue rather than a filter applied on the way out.
      tags: [changes]
      x-psn-phase: P-M4
      parameters:
        - name: cursor
          in: query
          required: false
          description: The last event id you processed. Omit to start from the beginning.
          schema:
            type: string
            pattern: '^evt_[0-9abcdefghjkmnpqrstvwxyz]{26}$'
          example: evt_01jf8w2c9km3q7xz5r0v4t6y8b
      responses:
        '200':
          description: A page of at most 200 events. Cached 60 s per cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeFeedPage'
              examples:
                page:
                  summary: Two events
                  value:
                    items:
                      - id: evt_01jf8w2c9km3q7xz5r0v4t6y8b
                        type: repo-adopted
                        occurredAt: '2027-03-14T10:00:00Z'
                        payload:
                          nodeId: R_kgDOAbc123
                          owner: acme
                          name: widget-engine
                          state: registered
                          recordUrl: https://api.purposesource.org/v1/registry/repo/R_kgDOAbc123.json
                      - id: evt_01jh0y4e1np5s9zb7t2x6v8a0d
                        type: waiver-granted
                        occurredAt: '2027-04-01T00:00:00Z'
                        payload:
                          wvrId: wvr_01jk2a6g3qr7v1bd9w4z8x0c3f
                          nodeId: R_kgDOAbc123
                    next: evt_01jh0y4e1np5s9zb7t2x6v8a0d
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

  /v1/forms/{kind}:
    post:
      operationId: postForm
      summary: Contact, abuse or data-subject request
      description: |
        The site has no backend, so these three routes are the whole intake path. Each
        verifies its anti-abuse token server-side, forwards the payload as one
        transactional email to the steward inbox, and **stores nothing**.

        That is the entire data-protection story for a form submission: there is no
        record to breach, no record to subpoena, and no record to delete. The reply you
        get comes from a human reading email.
      tags: [forms]
      x-psn-phase: P-M2
      parameters:
        - name: kind
          in: path
          required: true
          description: Which inbox the message is routed to.
          schema:
            type: string
            enum: [contact, abuse, dsar]
          example: contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, message, token]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: Where to reply. Forwarded in the email and stored nowhere.
                subject:
                  type: string
                  maxLength: 200
                message:
                  type: string
                  minLength: 1
                  maxLength: 5000
                token:
                  type: string
                  maxLength: 2048
                  description: Anti-abuse challenge token, verified server-side before anything is sent.
            examples:
              contact:
                summary: A contact message
                value:
                  email: ospo@example.com
                  subject: Licence question
                  message: Does the four-year conversion date apply per release?
                  token: 0.AbCdEf...
      responses:
        '202':
          description: Accepted and forwarded. Nothing was stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormAck'
              examples:
                ack:
                  summary: Acknowledged, with a published response target
                  value:
                    ack: true
                    responseTarget: 5 business days
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: The anti-abuse challenge did not verify. Nothing was sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                turnstileFailed:
                  summary: Challenge failed
                  value:
                    error:
                      code: turnstile_failed
                      message: challenge verification failed
                      traceId: 01jf8w2c9km3q7xz5r0v4t6y8b
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  schemas:
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      description: |
        The single failure shape for every route. `code` is stable, lowercase and
        additive-only — write your handling against `code`, never against `message`.
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, traceId]
          properties:
            code:
              type: string
              enum:
                - invalid_repo_id
                - invalid_company_ref
                - repo_not_registered
                - company_ambiguous
                - cert_not_found
                - cert_not_in_ct_log
                - cert_revoked
                - artifact_not_found
                - sandbox_artifact_on_prod
                - turnstile_failed
                - rate_limited
                - artifacts_unavailable
                - internal
                - page_not_found
              description: The stable machine code.
            message:
              type: string
              description: Human-readable detail. Not stable; do not parse it.
            traceId:
              type: string
              description: Quote this when reporting a problem — it is the only thing that lets us find your request.

    CoverageAnswer:
      type: string
      description: |
        The eight coverage answers. Frozen: no ninth value will be added to `v1`, and the
        meaning of these eight will not change under you.

        `yes-via-donation` is retired: it is never returned. It was the answer for a Donation
        Entitlement, the credential of the direct donation route, and that route was dropped
        before it opened (ops decisions D91 item 3 and D93 item 1, 2026-10-01). No Donation
        Entitlement is issued, so no published entitlement record carries the `donation` term
        the function's donation step looks for. The value stays in this enumeration: the set
        of eight is frozen (FS-00 §6.3), `/v1/meta` lists all eight in `contracts.answerEnum`,
        and both published coverage modules still name it, so keeping it is the smallest
        change, wording only. A client that switches over all eight keeps working.
      enum:
        - yes-via-pass
        - yes-via-project
        - yes-via-portfolio
        - yes-via-waiver
        - yes-via-donation
        - 'no'
        - lapsed-in-grace
        - no-entitlement-required-under-threshold

    CoverageBasis:
      type: object
      additionalProperties: false
      required: [algoVersion, company, repo]
      description: What produced the answer. Always present, including for `no`.
      properties:
        algoVersion:
          type: string
          description: >-
            The coverage function version, `cov-v1`. Its source and vectors are published. Until the
            public launch it changes in place under this name, each change dated in the
            specification's changelog; from the launch a published version is never edited.
          example: cov-v1
        company:
          type: [object, 'null']
          additionalProperties: false
          required: [coId]
          description: The resolved organisation, or null when none resolved.
          properties:
            coId:
              type: string
              pattern: '^co_[0-9abcdefghjkmnpqrstvwxyz]{26}$'
            verification:
              type: string
              enum: [domain-verified, officer-attested, unverified]
        note:
          type: string
          description: Present when the answer needs a word of explanation, e.g. no record for the organisation.
        repo:
          type: object
          additionalProperties: false
          required: [nodeId, repoState]
          properties:
            nodeId:
              type: string
              pattern: '^([A-Za-z0-9_-]{4,128}|MDEwOlJlcG9zaXRvcnk[A-Za-z0-9+/=]{1,96})$'
            repoState:
              type: string
              enum: [registered, verified, suspended, quit, delisted, no-record]
              description: >-
                The state the repository's published record carries, as the coverage function read it.
                `registered` is the one state a record published from ops decision D82 on carries for a
                registered repository that is not suspended, whether or not its admins have claimed it (D82 and its dated note (d) of
                2026-09-29); `verified` is what records published before D82 carried. The coverage
                function reports a `verified` record as `registered`, so an answer never says `verified`;
                the value stays listed because answers given before 2026-09-30, when the function
                reported the record's state without branching on it, could carry it. `no-record` is
                not a registry state: no record is published under this node id, and the answer is a
                Pass's, with `reason` `pass-any-work` (D48 item 5). The repository may be registered and not
                yet published, or not under the licence at all; the answer checks neither. A quit or
                delisted repository still computes — coverage that was bought stays bought.
        entitlement:
          type: object
          additionalProperties: false
          required: [entId, lane]
          properties:
            entId:
              type: string
              pattern: '^ent_[0-9abcdefghjkmnpqrstvwxyz]{26}$'
            lane:
              type: string
              enum: [pass, project, portfolio, donation]
              description: >-
                The lane of the term that answered. `donation` is retired with `yes-via-donation`
                (see `CoverageAnswer`): no Donation Entitlement is issued, so no answer names one.
            periodStart:
              type: string
              format: date-time
            periodEnd:
              type: string
              format: date-time
        waiver:
          type: object
          additionalProperties: false
          required: [wvrId, grantedAt]
          properties:
            wvrId:
              type: string
              pattern: '^wvr_[0-9abcdefghjkmnpqrstvwxyz]{26}$'
            grantedAt:
              type: string
              format: date-time
        reason:
          type: string
          enum: [pass-any-work]
          description: >-
            Why the answer holds when the other members cannot show it (since 2026-09-30). `pass-any-work`: the
            repository has no published record (`repo.repoState: no-record`), and the organisation's
            Pass covers it because a Pass covers any work under the licence, registered or not (ops
            decision D48 item 5). Absent from every other answer.

    CoverageProof:
      type: object
      additionalProperties: false
      required: [type, url]
      description: |
        The artifact that backs the answer. Absent for `no` — there is nothing to prove.
        `sha256` is present when the deployment computed it, and honestly omitted when it
        did not.
      properties:
        type:
          type: string
          enum: [entitlement-jws, waiver-record]
        url:
          type: string
          format: uri
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'

    CoverageResponse:
      type: object
      additionalProperties: false
      required: [answer, basis, asOf]
      properties:
        answer:
          $ref: '#/components/schemas/CoverageAnswer'
        basis:
          $ref: '#/components/schemas/CoverageBasis'
        asOf:
          type: string
          format: date-time
          description: The instant the answer was computed as of. Echoed so you can re-derive it yourself.
        dates:
          type: object
          additionalProperties: false
          description: Present for the grace and under-threshold answers.
          properties:
            periodEnd:
              type: string
              format: date-time
            graceEnd:
              type: string
              format: date-time
            selfCertifiedAt:
              type: string
              format: date-time
        proof:
          $ref: '#/components/schemas/CoverageProof'

    Jwks:
      type: object
      additionalProperties: false
      required: [keys]
      description: |
        An RFC 7517 key set, plus two namespaced members per key: `psn:status` and
        `psn:validityWindow`. Retired keys are kept forever so that old certificates keep
        verifying.

        `keys` is the only REQUIRED member. The envelope below travels with the published
        artifact, and the same document is also minted by the edge deployment from its own
        bundle when storage holds nothing — a key set is worth serving with fewer envelope
        members than not at all, because it is the document a client resolves a `kid`
        against in order to check a signature.
      properties:
        schemaVersion:
          type: integer
          const: 1
          description: |
            The contract version, as FS-00 §6.2 asks of every artifact. Optional here
            because of the minted fallback above; the publishing build always stamps it.
        generatedAt:
          type: string
          format: date-time
          description: |
            When the publishing build produced this key set. On the published artifact it is
            also the response's `Last-Modified`; a minted answer carries no `Last-Modified`,
            and omits this member entirely when the deployment has no build instant to
            state — never a guessed one.
        source:
          enum: [registry-v0, sample, fixture, platform]
          description: |
            Which plane produced this artifact. `sample` and `fixture` declare a
            NON-PRODUCTION plane: every page that renders such an artifact is labelled
            sample, and a production deployment refuses to serve it (FS-10 §2 v0 note; the
            edge route answers `sandbox_artifact_on_prod`). `registry-v0` is the P-M2
            production source of record — the curated registry repository the index is
            built from. `platform` is the P-M3 producer of record — the platform database,
            rendered by `jobs.index-build`. Optional, and its absence asserts nothing: an
            artifact whose body cannot carry the label borrows the plane's declaration from
            `/registry/index/meta.json`. The enum widens additively when the P-M3 producer
            takes a value of its own, and `platform` (2026-09-12) is that widening:
            `jobs.index-build` writes it in `PSN_ENV=prod` and writes `fixture` in every
            other environment, so a reader can still tell a production plane from a
            synthetic one by the label alone.
        sandbox:
          type: boolean
          description: |
            `true` on `/sandbox/jwks.json` and nowhere else — the in-band marker FS08-103
            asks for, so a client holding only the body still knows the set is test-mode
            material. ABSENT rather than `false` on the production set: which document it
            is decides that, and a flag saying so could be copied onto a set that is not
            this one.
        keys:
          type: array
          items:
            type: object
            required: [kty, crv, x, y, kid, use, alg]
            properties:
              kty:
                type: string
                const: EC
              crv:
                type: string
                const: P-256
              x:
                type: string
                description: base64url x coordinate.
              y:
                type: string
                description: base64url y coordinate.
              kid:
                type: string
                pattern: '^psn-(dev|prod|sandbox)-[0-9]{4}-[0-9]+$'
              use:
                type: string
                const: sig
              alg:
                type: string
                const: ES256
              "psn:status":
                type: string
                enum: [active, retired, compromised]
              "psn:validityWindow":
                type: object
                required: [notBefore]
                properties:
                  notBefore:
                    type: string
                    format: date-time
                  notAfter:
                    type: [string, 'null']
                    format: date-time

    DomainIndex:
      type: object
      additionalProperties: false
      required: [schemaVersion, generatedAt, domains]
      properties:
        schemaVersion:
          type: integer
          const: 1
        generatedAt:
          type: string
          format: date-time
        source:
          enum: [registry-v0, sample, fixture, platform]
          description: |
            Which plane produced this artifact. `sample` and `fixture` declare a
            NON-PRODUCTION plane: every page that renders such an artifact is labelled
            sample, and a production deployment refuses to serve it (FS-10 §2 v0 note; the
            edge route answers `sandbox_artifact_on_prod`). `registry-v0` is the P-M2
            production source of record — the curated registry repository the index is
            built from. `platform` is the P-M3 producer of record — the platform database,
            rendered by `jobs.index-build`. Optional, and its absence asserts nothing: an
            artifact whose body cannot carry the label borrows the plane's declaration from
            `/registry/index/meta.json`. The enum widens additively when the P-M3 producer
            takes a value of its own, and `platform` (2026-09-12) is that widening:
            `jobs.index-build` writes it in `PSN_ENV=prod` and writes `fixture` in every
            other environment, so a reader can still tell a production plane from a
            synthetic one by the label alone.
        domains:
          type: object
          description: Verified domain to organisation ULID. Domain-verified organisations only.
          additionalProperties:
            type: string
            pattern: '^co_[0-9abcdefghjkmnpqrstvwxyz]{26}$'

    CtCheckpointArtifact:
      type: object
      additionalProperties: false
      required: [schemaVersion, generatedAt, jws, payload]
      properties:
        schemaVersion:
          type: integer
          const: 1
        generatedAt:
          type: string
          format: date-time
        jws:
          type: string
          pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          description: The signed checkpoint. This is the artifact that carries trust.
        payload:
          $ref: '../schemas/ct-checkpoint.v1.json'

    ChangeFeedPage:
      type: object
      additionalProperties: false
      required: [items, next]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '../schemas/change-event.v1.json'
        next:
          type: string
          description: Always present, even when `items` is empty. Poll with it and you idle cheaply.

    Meta:
      type: object
      additionalProperties: false
      required: [edgeVersion, coverage, contracts]
      description: The deployment's self-description, so its behaviour can be checked against what was published.
      properties:
        edgeVersion:
          type: string
          description: Deployed build identifier. Also returned as a response header on every route.
        coverage:
          type: object
          additionalProperties: false
          required: [algoVersion, moduleSha256]
          properties:
            algoVersion:
              type: string
              description: The coverage function this deployment runs — the one every answer's `basis.algoVersion` names.
              example: cov-v1
            moduleSha256:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: Digest of the deployed coverage module. Compare it with the published reference implementation.
        contracts:
          type: object
          additionalProperties: false
          required: [answerEnum]
          properties:
            answerEnum:
              type: array
              items:
                $ref: '#/components/schemas/CoverageAnswer'
              description: >-
                The eight frozen answers. `yes-via-donation` is listed and never returned (see
                `CoverageAnswer`).
            schemaVersions:
              type: object
              additionalProperties:
                type: integer
            errorCodes:
              type: array
              items:
                type: string
              description: |
                The envelope code space of THIS deployment — every `error.code` it is able
                to return. Listing a code says the deployment can produce it, which is a
                different statement from having produced it: `cert_revoked` is listed while
                no certificate has ever been revoked. Codes are additive-only, so the list
                grows and never loses a member.
        routes:
          type: object
          description: Which phase-gated routes are switched on in this deployment.
          additionalProperties:
            type: boolean
        env:
          type: string
          example: prod
          description: |
            The environment this deployment answers as — `prod`, `preview` and `dev` are the
            three deployed today. A plain string rather than a closed set, because naming a
            fourth deployment is a configuration act and should not need an amendment here.
            This is a published health key and not a debug field: the production availability
            check specified for this route asserts `edgeVersion` present and `env` equal to
            `prod` at its highest paging class, so a deployment that stopped answering with it
            would take that check down with it.
        api:
          enum: [proxied, disabled, unconfigured]
          description: |
            The state of the authenticated family on this deployment. Every path outside the
            public read set is proxied to the origin; this member says whether that is
            actually happening. `proxied` is claimed only when the family is switched on AND
            an origin is configured. `disabled` is the honest answer while the family is off.
            `unconfigured` reports the defect — switched on with no origin — instead of
            hiding it behind a word that sounds like it works.
        rateLimits:
          type: object
          additionalProperties: false
          description: |
            The published limit table, in machine form. The same figures are published in
            prose on the API documentation page and in the caption of every form section,
            from this one table — so a client can read the limits instead of discovering
            them. `enforced` reports the kill switch honestly: a deployment with the limiter
            off says so here rather than advertising figures it is not applying.
          properties:
            keyedBy:
              type: string
              example: "ip: IPv4 address, IPv6 /64 prefix"
              description: >-
                What a counter counts against — the client address, taken from the header the platform
                writes on every request and a caller cannot forge. An IPv4 address (and an IPv4-mapped
                IPv6 address) counts whole; an IPv6 address counts by its /64 prefix, because one
                ordinary IPv6 network holds 2^64 addresses and a per-address counter would bound
                nothing (2026-09-23). The value is free-form and starts with `ip`.
            enforced:
              type: boolean
              description: Whether the limiter is switched on here. `false` means the figures below are published and not applied.
            scope:
              type: string
              example: per Cloudflare location
              description: The span one counter covers. Limits are counted at the edge location that served the request, never globally.
            classes:
              type: object
              description: One entry per limit class. The key space is deliberately open — a class arrives by being deployed, not by amending this contract.
              additionalProperties:
                type: object
                additionalProperties: false
                required: [limit, periodSeconds, routes]
                properties:
                  limit:
                    type: integer
                    minimum: 1
                    description: Requests admitted per period.
                  periodSeconds:
                    type: integer
                    minimum: 1
                    description: The period the limit counts over.
                  routes:
                    type: array
                    items:
                      type: string
                    description: The route templates this class covers.
        verifyAt:
          type: string
          format: uri
          example: https://purposesource.org/verify
          description: |
            Where a human verifies a certificate. Published here so that a holder of a
            certificate naming the page can check this deployment names the same one.
        publishedAt:
          type: string
          format: date-time
          description: |
            When the artifact plane this deployment serves was PUBLISHED — read from the
            LAST batch record of `/meta/publish-log.json`, which is the newest because that
            array is oldest first, never from an artifact's `generatedAt`, which is pinned
            to the build's INPUTS so that unchanged data produces unchanged bytes. Absent
            on a deployment that has read no publish log.
            Typed here before it is served: the rule that puts it on this route is already
            recorded, and a closed object would otherwise be amended twice for one decision.
        stale:
          type: boolean
          description: |
            Whether `publishedAt` has fallen outside the publication period plus its grace.
            The deployment computes it so a reader does not have to know the period. Absent
            whenever `publishedAt` is, and typed here for the same reason.

    FormAck:
      type: object
      additionalProperties: false
      required: [ack, responseTarget]
      properties:
        ack:
          type: boolean
          const: true
        responseTarget:
          type: string
          description: The published response-time target. Best effort, and stated as such — there is no service level agreement.

    PageVersion:
      type: object
      additionalProperties: false
      required: [schemaVersion, pid, versionId]
      description: |
        Which published version of a contributor page is being served: the page document's
        `pid` and `versionId` (`contributor-page.v1`), and nothing else — no name, no login, no
        date.
      properties:
        schemaVersion:
          const: 1
        pid:
          type: string
          pattern: '^[0-9a-hjkmnp-tv-z]{16}$'
        versionId:
          type: string
          pattern: '^pgv_[0-9a-hjkmnp-tv-z]{26}$'
          description: >-
            Opaque: 130 random bits, never a ULID, whose leading characters would be a millisecond
            timestamp and so would date each publish on this public route. The dashboard compares
            it with the id its publish was given.

  responses:
    BadRequest:
      description: |
        Malformed input. `invalid_company_ref` includes putting a domain in the GET
        `company` parameter — that is not an oversight, it is the rule.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalidCompanyRef:
              summary: A domain was passed to the GET form
              value:
                error:
                  code: invalid_company_ref
                  message: GET accepts a co_ ULID only; use POST for a domain-keyed lookup
                  traceId: 01jf8w2c9km3q7xz5r0v4t6y8b

    NotFound:
      description: |
        The addressed artifact does not exist. Note the asymmetry on the coverage route: a
        repository with no registry record is this error (`repo_not_registered`) unless the
        organisation holds a Pass inside its term, which covers any work under the licence
        (ops decision D48 item 5), while an organisation with no record is the answer
        `no`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            repoNotRegistered:
              summary: No registry record for the repository, and no Pass inside its term
              value:
                error:
                  code: repo_not_registered
                  message: no registry record for this repository
                  traceId: 01jf8w2c9km3q7xz5r0v4t6y8b
            certNotFound:
              summary: No such certificate
              value:
                error:
                  code: cert_not_found
                  message: no verify record for this certificate id
                  traceId: 01jh0y4e1np5s9zb7t2x6v8a0d

    Conflict:
      description: The reference is genuinely ambiguous and we will not guess.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            companyAmbiguous:
              summary: A domain maps to more than one organisation
              value:
                error:
                  code: company_ambiguous
                  message: this domain resolves to more than one organisation; use a co_ id
                  traceId: 01jj1z5f2pq6t0ac8v3y7w9b1e

    RateLimited:
      description: |
        Per-IP limit tripped. Limits are published in the trust centre, and conditional
        requests with `If-None-Match` are cheap by design — polling correctly will not
        get you here.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            rateLimited:
              summary: Slow down
              value:
                error:
                  code: rate_limited
                  message: per-IP rate limit exceeded
                  traceId: 01jk2a6g3qr7v1bd9w4z8x0c2f

    ArtifactsUnavailable:
      description: |
        Both the edge mirror and the origin were unreachable and the serve-stale window
        was exhausted. This is the only shape a total outage takes on this API; routes
        that can serve stale will do so instead of returning this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unavailable:
              summary: Serve-stale exhausted
              value:
                error:
                  code: artifacts_unavailable
                  message: published artifact temporarily unreadable
                  traceId: 01jm3b7h4rs8w2ce0x5a9y1d3g
