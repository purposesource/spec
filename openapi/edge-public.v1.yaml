  /v1/recipient-list/index.json:
    get:
      operationId: getRecipientListIndex
      summary: Every released Recipient List version, what became of it, and every immediate removal
      description: |
        The Recipient List's released versions, newest first, one entry per version token.
        Each entry states the version's `status`, the month it takes effect from and its
        release instant and, once a steward has recorded the version's publication, the
        instant of its first proven publication and the publish batch that proves it, with
        the notice the record holds on a `recorded` version. There is deliberately no
        `adopted` status: every released version publishes an adopted board decision, and
        what the platform can prove afterwards is a publication and its instant.

        Beside the versions, every organisation removed at once under statutes Art. 7(6),
        newest first, with the instant and the ground published with the removal. A removal
        records no version, so it is published here and never by rewriting a version.

        Regenerated whenever a release, a record act or a removal changes it. An entry never
        leaves the index: a version published too late, or a release that was voided, keeps
        its line with that status. Before the first release it is published with `versions`
        and `removals` empty, so an empty list says no version has been released, where a
        `404` says the index has not been built.

        Check each entry against the version document at its `url`, and its
        `publishBatchId` against `/meta/publish-log.json`; the schema says which members to
        compare. The board's published List governs: where this index and the List ever
        disagree, the divergence is a defect to report.
      tags: [recipient-list]
      x-psn-phase: P-M3
      responses:
        '200':
          description: The index. Cached 300 s.
          content:
            application/json:
              schema:
                $ref: '../schemas/recipient-lists.v1.json'
              examples:
                beforeFirstRelease:
                  summary: Published, before any version has been released
                  value:
                    schemaVersion: 1
                    generatedAt: '2026-11-02T05:00:00Z'
                    source: fixture
                    versions: []
                    removals: []
                fiveVersions:
                  summary: Two versions recorded, one late, one voided, the newest released and not yet recorded, and one removal (development plane)
                  value:
                    schemaVersion: 1
                    generatedAt: '2027-04-20T09:10:00Z'
                    source: fixture
                    versions:
                      - version: v1.3
