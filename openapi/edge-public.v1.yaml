  /v1/ledger/{month}.json:
    get:
      operationId: getLedgerMonth
      summary: One month of the ledger
      description: |
        The month's rows, its totals, and the hash-chain heads that bracket it. A closed
        month is immutable: regeneration may only ever re-emit byte-identical content, and
        a divergence is an alert rather than a fix.

        Corrections are **forward-dated rows**, never edits. Narrative context is a
        zero-amount annotation row. Disbursed quarters are never restated, and no refund
        is ever clawed back from a charity.

        The CSV twin at the same path with a `.csv` extension carries the same rows flat.
        If the page, the JSON and the CSV ever disagree, that is a defect — please report
        it.
      tags: [ledger]
      x-psn-phase: P-M2
      parameters:
        - name: month
          in: path
          required: true
          description: Month key, `YYYY-MM`.
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: 2027-06
      responses:
        '200':
          description: The month export. Closed months cached 86400 s; `immutable` is deliberately not set, because an annotation is always possible.
          content:
            application/json:
              schema:
                $ref: '../schemas/ledger-export.v1.json'
              examples:
                intakeOnly:
                  summary: An open month with one intake row — the v0 shape
                  value:
                    schemaVersion: 1
                    month: 2027-06
                    generatedAt: '2027-06-02T06:00:00Z'
                    currency: CHF
                    locked: false
                    lockedAt: null
                    totals:
                      pool: 36000
                    rows:
