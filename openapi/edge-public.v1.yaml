                $ref: '../schemas/registry-index-meta.v1.json'
              examples:
                small:
                  summary: A small registry, honestly small
                  value:
                    schemaVersion: 1
                    generatedAt: '2027-06-01T05:00:00Z'
                    shards:
                      - shard: w
                        url: https://api.purposesource.org/v1/registry/index/w.json
                        count: 2
