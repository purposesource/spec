      operationId: getRegistryIndexMeta
      summary: Registry index table of contents
      description: |
        The shard list, registry-wide counts, and the delisted set the badge route uses as
        a guard against stale caches. Fetch this first; fetch only the shards you need.

        Every registered repository is **listed and counted once**, whether or not its
        admins have claimed it: in `totals.registered`, or in `totals.suspended` while it
        is suspended. No count here separates claimed from unclaimed (ops decision D82
        items 1 and 3). Until D82 this route counted detected-but-unclaimed repositories
        and listed them nowhere.
      tags: [registry]
      x-psn-phase: P-M2
