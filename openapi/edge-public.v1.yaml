        Each entry states the key's `status` and, once a steward has recorded the key's
        publication, the Europe/Zurich date it was published on and the publish batch
        that proves it. There is deliberately no `adopted` status: the board's decision is
        its minuted resolution (`decisionRef`), and what the platform can prove afterwards
        is a publication and its date.

