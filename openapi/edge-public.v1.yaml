      summary: One month of the ledger
      description: |
        The month's rows, its totals, and the hash-chain heads that bracket it. A closed
        month is immutable: regeneration may only ever re-emit byte-identical content, and
        a divergence is an alert rather than a fix.

        Corrections are **forward-dated rows**, never edits. Narrative context is a
        zero-amount annotation row. Disbursed quarters are never restated, and no refund
        is ever clawed back from a charity.

        The CSV twin at the same path with a `.csv` extension carries the same rows flat.
        If the page, the JSON and the CSV ever disagree, that is a defect — please report
        it.
