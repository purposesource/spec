  /v1/allocation-keys/{month}.json:
    get:
      operationId: getAllocationKey
      summary: The allocation key released for one month
      description: |
        How the shares that nobody designated, or that were expressly left to the
        Association, are split across the published categories for one month (statutes
        Art. 8(4); Calculation Rules Nr. 29), with the exact text two stewards approved
        carried as the string `approvedBody` and its SHA-256 as `bodySha256`. Recompute
        the hash over the string as carried — for example
        `jq -j .approvedBody | sha256sum` — and read the key, the month and the
        `decisionRef` back out of the approved text. The board's resolution named by
        `decisionRef` is the decision; this document is its publication, and where the two
        ever disagree the resolution governs and the divergence is a defect to report.

        Written once per month and never rewritten, so its `generatedAt`, and with it
        `Last-Modified`, is the release instant. It carries no publication date, because no
        document can carry the date it was first published: the index states that date
        once a steward has recorded it, and a released key governs nothing until then.

        Cached 300 s although the document never changes, so that a `404` answered for a
        month before its key was written is not held for longer than that once the key is
        published.
      tags: [allocation-keys]
      x-psn-phase: P-M3
      parameters:
        - name: month
          in: path
          required: true
          description: The key's effective month, `YYYY-MM`.
          schema:
            type: string
            pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          example: 2027-01
      responses:
        '200':
          description: The key document. Cached 300 s.
          content:
            application/json:
              schema:
                $ref: '../schemas/allocation-key.v1.json'
              examples:
                januaryKey:
                  summary: A key released for January (development plane)
