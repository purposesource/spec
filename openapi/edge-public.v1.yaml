  /v1/recipient-list/{version}.json:
    get:
      operationId: getRecipientListVersion
      summary: One released version of the Recipient List
      description: |
        One released version of the Recipient List: the organisations that receive what the
        fees account passes on, each in one of the seven published categories and each
        `pending` or `active` (statutes Art. 7(1) and (4)), with the version's
        `effectiveFrom`, the board's decision (`adoptedAt`, `decisionRef`) and the share
        rule. An `active` entry also carries the month it is active from, the standard it
        meets (as references into its recipient file) and the three dates of its activation
        decision. The document maps the released body member by member and never carries it
        verbatim, and it publishes no screening record, no person and no bank detail. The
        board's published List is the legal instrument, not this document: where the two ever
        disagree the List governs and the divergence is a defect to report.

        Written once per released version and never rewritten, so its `generatedAt`, and
        with it `Last-Modified`, is the release instant. It carries no publication date and
        no notice, because no document can carry the date it was first published: the index
        states both once a steward has recorded the version, and a released version governs
        no month until then.

        Cached 300 s although the document never changes, so that a `404` answered for a
        version before its document was written is not held for longer than that once the
        document is published.
      tags: [recipient-list]
      x-psn-phase: P-M3
      parameters:
        - name: version
          in: path
          required: true
          description: The version's token, `v<major>` or `v<major>.<minor>`, as the index names it; the founding List is `v1.0`.
          schema:
            type: string
            pattern: '^v[0-9]+(\.[0-9]+)?$'
          example: v1
      responses:
        '200':
          description: The version document. Cached 300 s.
