                    projectsRegistered: 12
                    contributorsClaimed: null
                    companiesCovered: 6
                    chfRoutedMinor: null
                    cur: CHF
                    firstDisbursementScheduledFor: '2027-07-15'
                    loi: null
                    smallnessThresholds:
                      projects: 25
                      contributors: 50
                      companies: 10
                    links:
                      registry: https://purposesource.org/registry
                      ledger: https://purposesource.org/ledger
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

  /v1/meta:
    get:
      operationId: getMeta
      summary: Deployment self-description
      description: |
        What this deployment is running. Two fields matter to an auditor: the coverage
        module's digest, which must equal the digest of the published reference
        implementation, and the answer enumeration, which must be exactly the eight frozen
        values.

        Continuous integration checks the first equality on every deploy. This endpoint
        lets anybody else check it too, at any time, without asking us.
      tags: [meta]
      x-psn-phase: P-M2
      responses:
        '200':
          description: The deployment's own description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meta'
              examples:
                deployed:
                  summary: A production deployment
                  value:
                    edgeVersion: 2027.06.01-3
                    coverage:
                      algoVersion: cov-v1
                      moduleSha256: 3b1c9e0a5d7f2846bb14c0e9a7d3f5028c6b4a19e7d2f80315a9c4b6e8d0f2a4
                    contracts:
                      answerEnum:
                        - yes-via-pass
                        - yes-via-project
                        - yes-via-portfolio
                        - yes-via-waiver
                        - yes-via-donation
                        - 'no'
                        - lapsed-in-grace
                        - no-entitlement-required-under-threshold
                      schemaVersions:
                        repo-record: 1
                        entitlement-record: 1
                        certificate-record: 1
                        badge: 1
                        stats: 1
                    routes:
                      coverage: false
                      changes: false
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/registry/index/meta.json:
