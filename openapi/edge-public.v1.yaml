  /v1/entitlements/{coId}.jws:
    get:
      operationId: getEntitlementRecord
      summary: Signed entitlement record for one organisation
      description: |
        A compact ES256 JWS, served as `application/jose`. **This is the scanner-facing
        proof of coverage**, and at v0 it is the *only* machine proof: the computed
        coverage endpoint arrives later, and this record does not wait for it.

        Verify the signature against the production key set before trusting the payload.
        The payload's schema is published alongside this document.

        The record verifies whether or not the organisation chose to be named publicly —
        directory listing is opt-in and defaults to unnamed, and a payer's proof does not
        depend on advertising.
      tags: [entitlements]
      x-psn-phase: P-M2
      parameters:
        - name: coId
          in: path
          required: true
          description: The organisation's platform ULID.
          schema:
            type: string
            pattern: '^co_[0-9abcdefghjkmnpqrstvwxyz]{26}$'
          example: co_01jf8w2c9km3q7xz5r0v4t6y8b
      responses:
        '200':
          description: The compact JWS. Purged on purchase, renewal, lapse, suspension or void.
          content:
            application/jose:
              schema:
                type: string
                pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
                description: JWS compact serialisation. Decode the payload against entitlement-record.v1.json.
              examples:
                compact:
                  summary: A compact JWS (truncated for documentation)
                  value: eyJhbGciOiJFUzI1NiIsImtpZCI6InBzbi1wcm9kLTIwMjctMSJ9.eyJjb0lkIjoiY29fMDFqZjh3MmM5a20zcTd4ejVyMHY0dDZ5OGIifQ.MEUCIQDexampleSignatureBytesHereOnlyForDocumentation
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

