openapi: 3.1.0

info:
  title: Purpose Source Network — public read API
  version: 1.14.0
  summary: Keyless, unauthenticated read access to every published artifact of the Purpose Source Network.
  description: |
    Every route here is **unauthenticated, keyless and CORS-open for GET**. There is no
    API key to request, no account to create, and no rate plan to negotiate — an OSPO or
    an SCA scanner can consume this API the way it consumes a static file, because that is
    essentially what it is.

    ## The one architectural rule

    These endpoints serve **only published artifacts**. The workers behind them hold no
    database path by construction, which is what makes the public surface cost almost
    nothing at idle and shrug at a hundredfold traffic spike. Freshness is therefore
    **eventually consistent by design**: the published propagation bound for
    coverage-relevant state is five minutes worldwide, and nothing here promises real
    time.

    Every artifact response carries an `ETag` and a `Last-Modified` equal to the
    artifact's own `generatedAt`, and honours `If-None-Match` with `304`. Polling with
    `If-None-Match` is the intended usage pattern, not an abuse of it.

    ## Errors

    Every failure answers with the same envelope and a stable, lowercase machine `code`:

    ```json
    { "error": { "code": "repo_not_registered", "message": "…", "traceId": "…" } }
    ```

    Codes are additive-only. A breaking change means a new versioned URL, never an
    in-place mutation of this one.

    ## Phase availability

    Not every route is live yet. Each operation carries `x-psn-phase`:

    - `P-M2` — live in the first public version. The twelve README card names of
      `getRepositoryBadge` are the exception: the edge draws them only where the deployment's
      README card switch is on, and production's is off, so there each is still read as a badge
      name, as it was before the cards existed.
    - `P-M3` — the computed coverage endpoint. At P-M2 the coverage proof is the
      published entitlement JWS plus the human verify page; the endpoint activates later
      with no schema change. The two allocation-key routes are P-M3 as well: their
      producer is the platform's index build, and until its first run writes the index
      both answer `404`. The designations summary route is P-M3 as well, for the same
      producer: a month no index-build run rendered answers `404`. The two Recipient List
      routes are P-M3 for the same producer: both answer `404` until its first run writes
      the index, and a version no run has written answers `404` after that. The three
      contributor-page routes are P-M3 too: nothing is published under them until a
      person publishes a page, and production publishes none
      until its publishing switch is on, so until then each answers as for a page that does
      not exist. The certificate badges and the two card routes are P-M3 for the same
      reason: their producers are the platform's index build and render job, a certificate
      badge answers `not found` and a card the generic card until a certificate or a card is
      published, and the index build does not copy repository cards yet.
    - `P-M4` — the change feed and the sandbox tenant, both demand-gated.

    ## Machine-readable schemas

    Every artifact body is described by a JSON Schema published alongside this document
    at `https://purposesource.org/spec/schemas/`. The schemas are the authority on
    artifact content; this document is the authority on routes, status codes and caching.

    ## Apex aliases

    A few canonical endpoints are also mounted on the apex domain by the same worker:
    `/registry.json` (the bulk registry export), `/transparency.json` (the latest ledger
    export), `/schedule.json` (the current fee-schedule version), `/stats.json`,
    `/jwks.json` and `/ct/*`. They serve byte-identical bodies.

    ## Contributor pages are not routes of this API

    A contributor's own page is HTML that the same worker draws from the page's published
    document on the SITE host, at `https://purposesource.org/p/{pid}` (the permanent link),
    `/u/{login}` or `/u/{login}/{pid}` (whichever address the person chose), with the page's
    stylesheet and fonts under `/u/_a/` and its pictures under `/p/{pid}/`. It is not part of
    this API and has no operation here.

    On the site host the permanent link answers the page itself while the person chose the
    anonymous address. While they chose the login address `/u/{login}` or the mixed address
    `/u/{login}/{pid}`, a page view of `/p/{pid}` answers `302` with `Location` set to exactly
    that address, the page's canonical address (ops decision D138): the permanent link is the
    one to share, and it opens the page under the person's current login. Where the edge
    cannot serve that address with this page, for example while its login alias is not yet
    published or names another page, the permanent link keeps serving the page itself. The
    redirect is
    temporary, never `301` or `308`, so it ends the moment the address does (a rename, a switch
    to anonymous); it has no body, the page's `Cache-Control: public, max-age=60` and
    `X-Robots-Tag: noindex, nofollow`, and its location is built from the deployment's own page
    origin and the published document, never from the request. The card view (`?view=card`),
    the page's pictures, the private preview and every `/u/` address are never redirected (a
    retired or old login address answers like a page that never existed), and a page that is
    not public answers the same `404` at `/p/{pid}` as before. QR codes, snippets, badges and
    cards keep naming `/p/{pid}`.

    Each of the three addresses has a heads-up page one segment further: `/p/{pid}/leave`,
    `/u/{login}/leave` and `/u/{login}/{pid}/leave` (ops decision D178 item 4). A page's links
    to the platforms it draws (the social platforms and the sponsorship platforms of
    `link-platforms.v1`) are rebuilt on each platform's own domain and open directly; the one
    link that may name any domain, the person's website, opens the heads-up page in a new tab.
    It answers for exactly the page its address answers, and only while that page has a
    website: it shows the website's domain as the page shows it (an internationalised name in
    Unicode only where the page would, otherwise its A-labels) and the whole address, with a
    link that continues there in the same tab and one back to the page. Its only destination is
    the published page's own website: nothing of the request but its path is read, so it never
    sends a reader to an address the request names. It carries the page's headers (no script,
    `X-Frame-Options: DENY`, `Cache-Control: public, max-age=60`) and `X-Robots-Tag: noindex,
    nofollow` on every address, and every other case answers the same `404` as a page that does
    not exist. The page itself names the website in a `<link rel="me">`, so rel-me verification
    still finds the address.

    On this API's host every `/p/*` and `/u/*` path answers `301` to the same path on the site
    host (a mis-cased or slash-ended address to its lower-case form), and nothing is read to
    decide that. The owner's private preview, `/v1/me/page/preview`, needs the owner's session:
    it belongs to the authenticated family and is not described here either. So does the
    person's certificate preview, `/v1/me/certificate-preview/{card|picture|badge.svg|badge-card.svg|badge-card-dark.svg}`,
    which the same worker draws, marked `PREVIEW` and never issued, from the application's
    `GET /v1/me/certificates/participation/preview` for that session alone: `private, no-store`,
    framed by the dashboard alone, and `400 invalid_query` for a query outside that read's grammar.
    So does its sibling for a repository the person administers and has not registered,
    `/v1/me/repo-preview/{card|card-github|badge.svg|badge-card.svg|badge-card-dark.svg}?repo={nodeId}`,
    drawn the same way from the application's `GET /v1/admin/repos/candidates` for that session,
    with the name that read gives and never one from the request.
    This API's contributor-page routes are the three tagged `contributor-pages` below.
  contact:
    name: Purpose Source Network
    url: https://purposesource.org/trust/api
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: https://api.purposesource.org
    description: Production. The only production host.

# Deliberately empty: every route is unauthenticated and keyless. There is no scheme to
# declare because there is nothing to authenticate — an OSPO consumes this API the way it
# consumes a static file. Stated explicitly rather than omitted, so a reader can tell the
# difference between "no security" and "security we forgot to document".
security: []

tags:
  - name: coverage
    description: The coverage answer — is this organisation covered for this repository?
  - name: certificates
    description: Certificate verification and the transparency log.
  - name: keys
    description: Signing-key publication (JWKS).
  - name: registry
    description: The registry of adopting repositories.
  - name: entitlements
    description: Signed organisation entitlement records.
  - name: ledger
    description: The append-only allocation ledger and its hash chain.
  - name: allocation-keys
    description: The board's allocation key for each month, published before the month, and the index of what became of each.
  - name: recipient-list
    description: "The Recipient List: each version two stewards released, written once, and the index of what became of each and of every immediate removal."
  - name: designations
    description: "Designations in summary: the projects' and, behind a floor, the contributors' designations for each month (advisory; routes money only after the fairness review, D27)."
  - name: badges
    description: README badges — the shields.io endpoint body, and the SVG badges the edge draws for a repository, its README cards included, and for a certificate.
  - name: cards
    description: Share and link-preview images — a certificate's card and a repository's project cards (PNG), with the generic card as their fallback.
  - name: contributor-pages
    description: A contributor's own public page — which version is public, its card and its badge. The page itself is HTML on the site host, never JSON; on this host its paths answer 301 to the site host.
  - name: counters
    description: Public counters, with an explicit state machine so an absent number is a documented state.
  - name: changes
    description: The change-event feed — the sync primitive for integrators.
  - name: forms
    description: No-storage intake routes for contact, abuse and data-subject requests.
  - name: meta
    description: Deployment self-description and diagnostics.

paths:
  /v1/coverage:
    get:
      operationId: getCoverage
      summary: Coverage answer for an organisation and a repository
      description: |
        Answers with one of exactly eight values, plus a `basis` block naming what
        produced the answer and a `proof` pointing at the signed artifact that backs it.
        One of the eight, `yes-via-donation`, is retired and never returned (see
        `CoverageAnswer`).

        **GET accepts an opaque company ULID only.** A domain in the `company` parameter
        is rejected with `invalid_company_ref`, because a third-party organisation's
        identifier must never appear in a shareable, CDN-cached, log-visible URL. Use
        `POST` for a domain-keyed lookup.

        Absence of a record for the organisation is `no`, never an error — legibility for
        scanners matters more than a pedantic 404. A repository with no published registry
        record is different. A Pass covers any work under the licence, registered or not
        (ops decision D48 item 5), so an organisation holding a Pass inside its term is
        answered `yes-via-pass` about it, with `basis.repo.repoState: no-record` and
        `basis.reason: pass-any-work` saying why. `no-record` says only that no record is
        published under the node id asked about: the repository may be registered and not
        yet published, or not under the licence at all, and the answer checks neither. For
        every other organisation — one holding no Pass inside its term — the question cannot
        be asked about that repository, and the answer is `repo_not_registered`. A
        registered repository is answered the same way whether or not its admins have
        claimed it (ops decision D82).

        The answer is computed by a published, versioned pure function over three signed or
        published inputs, `cov-v1`, which `basis.algoVersion` names. The module and its test
        vectors are in the same repository as this document, and the running deployment
        publishes the digest of the module it runs at `/v1/meta`, so the code that answered
        your query is checkable against the code we published.
      tags: [coverage]
      x-psn-phase: P-M3
      parameters:
        - name: company
          in: query
          required: true
          description: The organisation's platform ULID. A domain here is `invalid_company_ref` — use POST.
          schema:
            type: string
            pattern: '^co_[0-9abcdefghjkmnpqrstvwxyz]{26}$'
          example: co_01jf8w2c9km3q7xz5r0v4t6y8b
        - name: repo
          in: query
          required: true
          description: The repository's GitHub node id. Names and owners are display caches and are not accepted.
          schema:
            type: string
            pattern: '^([A-Za-z0-9_-]{4,128}|MDEwOlJlcG9zaXRvcnk[A-Za-z0-9+/=]{1,96})$'
          example: R_kgDOAbc123
      responses:
        '200':
          description: The coverage answer. Edge-cached for 300 s and purged on every entitlement or waiver publish batch.
          headers:
            Cache-Control:
              description: Edge cache policy for this route.
              schema:
                type: string
              example: public, s-maxage=300
            ETag:
              description: Strong validator. Send it back as `If-None-Match`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageResponse'
              examples:
                yesViaPass:
                  summary: Covered by an active Pass
                  value:
                    answer: yes-via-pass
                    basis:
                      algoVersion: cov-v1
                      company:
                        coId: co_01jf8w2c9km3q7xz5r0v4t6y8b
                        verification: domain-verified
                      repo:
                        nodeId: R_kgDOAbc123
                        repoState: registered
                      entitlement:
                        entId: ent_01jf8w2c9km3q7xz5r0v4t6y9b
                        lane: pass
                        periodStart: '2027-01-01T00:00:00Z'
                        periodEnd: '2028-01-01T00:00:00Z'
                    asOf: '2027-06-01T12:00:00Z'
                    proof:
                      type: entitlement-jws
                      url: https://api.purposesource.org/v1/entitlements/co_01jf8w2c9km3q7xz5r0v4t6y8b.jws
                      sha256: b1946ac92492d2347c6235b4d2611184b1946ac92492d2347c6235b4d2611184
                lapsedInGrace:
                  summary: Term ended, inside the 30-day grace window
                  value:
                    answer: lapsed-in-grace
                    basis:
                      algoVersion: cov-v1
                      company:
                        coId: co_01jr7f1n8wx2a6gj4b9e3c5h7m
                        verification: officer-attested
                      repo:
                        nodeId: R_kgDOAbc123
                        repoState: registered
                      entitlement:
                        entId: ent_01jn4c8j5st9x3df1y6b0z2e5h
                        lane: project
                    asOf: '2027-06-01T12:00:00Z'
                    dates:
                      periodEnd: '2027-05-15T00:00:00Z'
                      graceEnd: '2027-06-14T00:00:00Z'
                    proof:
                      type: entitlement-jws
                      url: https://api.purposesource.org/v1/entitlements/co_01jr7f1n8wx2a6gj4b9e3c5h7m.jws
                      sha256: b1946ac92492d2347c6235b4d2611184b1946ac92492d2347c6235b4d2611184
                underThreshold:
                  summary: Under the licence threshold — no entitlement required
                  value:
                    answer: no-entitlement-required-under-threshold
                    basis:
                      algoVersion: cov-v1
                      company:
                        coId: co_01jn4c8j5st9x3df1y6b0z2e4h
                        verification: officer-attested
                      repo:
                        nodeId: R_kgDOAbc123
                        repoState: registered
                    asOf: '2027-06-01T12:00:00Z'
                    dates:
                      selfCertifiedAt: '2027-03-10T09:00:00Z'
                    proof:
                      type: entitlement-jws
                      url: https://api.purposesource.org/v1/entitlements/co_01jn4c8j5st9x3df1y6b0z2e4h.jws
                yesViaWaiver:
                  summary: Covered by a gratis waiver granted by the project admin
                  value:
                    answer: yes-via-waiver
                    basis:
                      algoVersion: cov-v1
                      company:
                        coId: co_01jk2a6g3qr7v1bd9w4z8x0c2f
                        verification: unverified
                      repo:
                        nodeId: R_kgDOAbc123
                        repoState: registered
                      waiver:
                        wvrId: wvr_01jk2a6g3qr7v1bd9w4z8x0c3f
                        grantedAt: '2027-04-01T00:00:00Z'
                    asOf: '2027-06-01T12:00:00Z'
                    proof:
                      type: waiver-record
                      url: https://api.purposesource.org/v1/waivers/R_kgDOAbc123.json#wvr_01jk2a6g3qr7v1bd9w4z8x0c3f
                yesViaPassNoRecord:
                  summary: A Pass covers a repository with no published registry record (D48 item 5)
                  value:
                    answer: yes-via-pass
                    basis:
                      algoVersion: cov-v1
                      company:
                        coId: co_01jf8w2c9km3q7xz5r0v4t6y8b
                        verification: domain-verified
                      repo:
                        nodeId: R_kgDONoRec01
                        repoState: no-record
                      entitlement:
                        entId: ent_01jf8w2c9km3q7xz5r0v4t6y9b
                        lane: pass
                        periodStart: '2027-01-01T00:00:00Z'
                        periodEnd: '2028-01-01T00:00:00Z'
                      reason: pass-any-work
                    asOf: '2027-06-01T12:00:00Z'
                    proof:
                      type: entitlement-jws
                      url: https://api.purposesource.org/v1/entitlements/co_01jf8w2c9km3q7xz5r0v4t6y8b.jws
                      sha256: b1946ac92492d2347c6235b4d2611184b1946ac92492d2347c6235b4d2611184
                noRecord:
                  summary: No record for this organisation — `no`, and no proof
                  value:
                    answer: no
                    basis:
                      algoVersion: cov-v1
                      company: null
                      note: no registry record for this organization
                      repo:
                        nodeId: R_kgDOAbc123
                        repoState: registered
                    asOf: '2027-06-01T12:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'
    post:
      operationId: postCoverage
      summary: Coverage answer, accepting a verified domain
      description: |
        Identical semantics and identical response schema to the GET form. It exists for
        one reason: a domain-keyed lookup must not travel in a URL. POST bodies are not
        cached, not shared in links, and not written to access logs the way query strings
        are.

        `company` accepts either a platform ULID or a domain that has been
        **domain-verified** for exactly one organisation. A domain mapping to more than
        one organisation answers `company_ambiguous` and lists nothing — the caller must
        use a ULID.

        Never cached. It computes from the same cached artifacts the GET form uses, so it
        costs the same.
      tags: [coverage]
      x-psn-phase: P-M3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [company, repo]
              properties:
                company:
                  type: string
                  maxLength: 253
                  description: A `co_` ULID or a verified domain.
                repo:
                  type: string
                  pattern: '^([A-Za-z0-9_-]{4,128}|MDEwOlJlcG9zaXRvcnk[A-Za-z0-9+/=]{1,96})$'
                  description: The repository's GitHub node id.
            examples:
              byDomain:
                summary: Domain-keyed lookup
                value:
                  company: example.com
                  repo: R_kgDOAbc123
      responses:
        '200':
          description: The coverage answer. Never cached.
          headers:
            Cache-Control:
              description: POST responses are never cached.
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageResponse'
              examples:
                yesViaProject:
                  summary: Covered by a Project term whose scope names this repository
                  value:
                    answer: yes-via-project
                    basis:
                      algoVersion: cov-v1
                      company:
                        coId: co_01jh0y4e1np5s9zb7t2x6v8a0d
                        verification: domain-verified
                      repo:
                        nodeId: R_kgDOAbc123
                        repoState: registered
                      entitlement:
                        entId: ent_01jh0y4e1np5s9zb7t2x6v8a1d
                        lane: project
                        periodStart: '2027-03-20T00:00:00Z'
                        periodEnd: '2028-03-19T00:00:00Z'
                    asOf: '2027-06-01T12:00:00Z'
                    proof:
                      type: entitlement-jws
                      url: https://api.purposesource.org/v1/entitlements/co_01jh0y4e1np5s9zb7t2x6v8a0d.jws
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

  /v1/verify/{certId}:
    get:
      operationId: getCertificateRecord
      summary: Verify record for one certificate
      description: |
        Passthrough of the published certificate record. The human verify page is the
        canonical place a certificate is checked; this route serves the same artifact to
        machines.

        Read the `ct` block carefully. A certificate whose signature verifies while its
        hash is **absent** from the transparency log must be treated as UNVERIFIED, not as
        a soft warning — that absence is exactly what a rogue issuance looks like. `ct:
        null` means signed-but-not-yet-logged.

        The record never contains more subject data than the certificate itself displays.
        Individual-subject records are unlisted: reachable only by their unguessable id,
        excluded from every index and sitemap, and served with `X-Robots-Tag: noindex`.
      tags: [certificates]
      x-psn-phase: P-M2
      parameters:
        - name: certId
          in: path
          required: true
          description: Certificate id — a prefixed ULID, non-guessable by construction.
          schema:
            type: string
            pattern: '^cert_[0-9abcdefghjkmnpqrstvwxyz]{26}$'
          example: cert_01jf8w2c9km3q7xz5r0v4t6y8a
      responses:
        '200':
          description: The certificate record. Cached 300 s, purged on issue and on revocation.
          headers:
            X-Robots-Tag:
              description: Individual-subject records are never indexed.
              schema:
                type: string
              example: noindex
            ETag:
              description: Strong validator.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '../schemas/certificate-record.v1.json'
              examples:
                revoked:
                  summary: A revoked corporate supporter certificate
                  value:
                    schemaVersion: 1
                    generatedAt: '2027-03-02T10:00:00Z'
                    cid: cert_01jf8w2c9km3q7xz5r0v4t6y8a
                    status: revoked
                    typ: supporter
                    variant: entitlement
                    sub: Example Industries AG
                    scope:
                      kind: project
                      repos: [R_kgDOAbc123]
                    band: 10-100M
                    period:
                      validFrom: '2027-01-01'
                      validUntil: '2027-12-31'
                    issuedAt: '2027-01-01T09:00:00Z'
                    kid: psn-prod-2027-1
                    ct:
                      seq: 118234
                      segment: 11
                    revocation:
                      reasonClass: project-delisting
                      at: '2027-03-01T12:00:00Z'
                    supersedes: null
                    supersededBy: null
                    verifyUrl: https://purposesource.org/verify/cert_01jf8w2c9km3q7xz5r0v4t6y8a
                    jws: eyJhbGciOiJFUzI1NiIsImtpZCI6InBzbi1wcm9kLTIwMjctMSJ9.eyJjaWQiOiJjZXJ0XzAxamY4dzJjOWttM3E3eHo1cjB2NHQ2eThhIn0.MEUCIQDexampleSignatureBytesHereOnlyForDocumentation
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

  /jwks.json:
    get:
      operationId: getJwks
      summary: Production signing keys (JWKS)
      description: |
        The production key set. Retired keys **stay here forever** with their validity
        windows, so a certificate issued years ago still verifies — key rotation must never
        invalidate what it signed.

        The same key set is committed to this contract repository with signed commits, so
        substituting keys on the website alone cannot forge trust. If the two copies
        disagree, do not trust either: say so publicly.

        Sandbox keys are a **disjoint set** published only at the sandbox path. A
        production route refuses sandbox key material outright.
      tags: [keys]
      x-psn-phase: P-M2
      responses:
        '200':
          description: The key set. Cached 3600 s, purged on rotation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
              examples:
                oneActiveKey:
                  summary: One active key, one retired
                  value:
                    schemaVersion: 1
                    generatedAt: '2027-01-01T00:05:00Z'
                    keys:
                      - kty: EC
                        crv: P-256
                        x: f83OJ3D2xF1Bg8vub9tLe1gHMzV76e8Tus9uPHvRVEU
                        y: x_FEzRu9m36HLN_tue659LNpXW6pCyStikYjKIWI5a0
                        kid: psn-prod-2027-1
                        use: sig
                        alg: ES256
                        "psn:status": active
                        "psn:validityWindow":
                          notBefore: '2027-01-01T00:00:00Z'
                          notAfter: null
                      - kty: EC
                        crv: P-256
                        x: MKBCTNIcKUSDii11ySs3526iDZ8AiTo7Tu6KPAqv7D4
                        y: 4Etl6SRW2YiLUrN5vfvVHuhp7x8PxltmWWlbbM4IFyM
                        kid: psn-prod-2026-1
                        use: sig
                        alg: ES256
                        "psn:status": retired
                        "psn:validityWindow":
                          notBefore: '2026-01-01T00:00:00Z'
                          notAfter: '2027-01-01T00:00:00Z'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

  /sandbox/jwks.json:
    get:
      operationId: getSandboxJwks
      summary: Sandbox signing keys (JWKS) — never production
      description: |
        The integrator test-mode key set, documented as non-production. Sandbox
        certificates sign with these keys, are marked as sandbox in every response body
        and header, and **never enter the transparency log**. No route ever merges this
        set with the production set.
      tags: [keys]
      x-psn-phase: P-M4
      responses:
        '200':
          description: The sandbox key set. Cached 3600 s.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
              examples:
                sandboxMarked:
                  summary: The test-mode set, marked in the body
                  value:
                    schemaVersion: 1
                    generatedAt: '2027-06-01T05:00:00Z'
                    sandbox: true
                    keys:
                      - kty: EC
                        crv: P-256
                        x: gI0GAILBdu7T53akrFmMyGcsF3n5dO7MmwNBHKW5SV0
                        y: SLW_xSffzlPWrHEVI30DHM_4egVwt3NQqeUD7nMFpps
                        kid: psn-sandbox-2026-1
                        use: sig
                        alg: ES256
                        "psn:status": active
                        "psn:validityWindow":
                          notBefore: '2026-01-01T00:00:00Z'
                          notAfter: null
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

  /badge/{nodeId}.json:
    get:
      operationId: getBadge
      summary: README badge (shields.io endpoint format)
      description: |
        The body a shields.io endpoint badge renders.

        Two behaviours are deliberate and may look odd from the outside. First, an
        **unknown repository answers 200**, with `isError: true` and the message "not
        registered" — shields renders errors from bodies, not from status codes, so a 404
        here would show a reader nothing at all. Second, a **suspended, quit or delisted**
        repository renders the neutral form: a stale cached badge must never keep
        asserting registration, so the worker serves neutral whenever the registry index
        contradicts the cached artifact.

        Every registered repository's badge says "registered", whether or not its admins
        have claimed it, unless it is suspended (ops decision D82 item 5).

        No money figure appears on any badge before real money has moved.
      tags: [badges]
      x-psn-phase: P-M2
      parameters:
        - name: nodeId
          in: path
          required: true
          description: >-
            The repository's GitHub node id, in either form GitHub has issued (the legacy one carries its
            `=` padding: `MDEwOlJlcG9zaXRvcnkyNTIxMTYxMDk=`). The edge refuses, before any read, a value that
            is not a repository node id in either form: `R_` and 6 to 118 characters, or the legacy form
            spelled as GitHub spells it (`%3D` is read as `=`; no other escape is decoded). It answers `400 invalid_repo_id`.
          schema:
            type: string
            pattern: '^([A-Za-z0-9_-]{4,128}|MDEwOlJlcG9zaXRvcnk[A-Za-z0-9+/=]{1,96})$'
          example: R_kgDOAbc123
      responses:
        '200':
          description: |
            The badge body — including for an unknown repository, which returns the
            error-shaped body at 200. Cached 3600 s, stale-while-revalidate 24 h,
            stale-if-error 7 days.
          content:
            application/json:
              schema:
                $ref: '../schemas/badge.v1.json'
              examples:
                registered:
                  summary: A registered repository, claimed or not
                  value:
                    schemaVersion: 1
                    label: purpose source
                    message: registered
                    color: brightgreen
                    cacheSeconds: 3600
                neutral:
                  summary: Suspended, quit or delisted — never keeps asserting registration
                  value:
                    schemaVersion: 1
                    label: purpose source
                    message: 'status: see registry'
                    color: lightgrey
                    cacheSeconds: 3600
                unknown:
                  summary: Unknown repository — 200 with an error-shaped body
                  value:
                    schemaVersion: 1
                    isError: true
                    label: purpose source
                    message: not registered
                    color: inactive
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: |
            Only when no cached copy exists anywhere. Wherever one does, this route serves
            stale rather than failing — a badge outage on someone's README is our problem,
            not theirs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/p/{pid}/version:
    get:
      operationId: getContributorPageVersion
      summary: Which version of one contributor page is public
      description: |
        The published version of a contributor page, a person's own public page (ops decision
        D116). The dashboard polls it after "Publish" until the `versionId` it was given appears,
        and after "Hide" until this route answers `404`, so the screen never claims success early.
        It answers from the live page document (`contributor-page.v1`, unlisted at `p/{pid}.json`
        in the published plane), read without a cache.

        The page itself is HTML on the site host — `https://purposesource.org/p/{pid}`, and the
        address the person chose, `/u/{login}` or `/u/{login}/{pid}` — rendered by the same worker
        from that document, with no script and no third-party request. The document is never
        served as JSON, and this route names nobody.

        **A page that is not public answers exactly like one that never existed.** Unknown,
        hidden, deleted and erased pages, a permanent link the person replaced, and a
        non-production plane on production all answer the same `404 page_not_found`, so probing an
        id reveals nothing about a person who withdrew their page. Ids are 80 random bits, so they
        cannot be enumerated either.
      tags: [contributor-pages]
      x-psn-phase: P-M3
      parameters:
        - name: pid
          in: path
          required: true
          description: The page's permanent id — 16 lower-case Crockford base32 characters of 80 random bits; not a ULID, so it dates nothing.
          schema:
            type: string
            pattern: '^[0-9a-hjkmnp-tv-z]{16}$'
          example: 7k2m9xq4tpz3r8vd
      responses:
        '200':
          description: The page is public, and this is the version being served. Never cached and never indexed.
          headers:
            Cache-Control:
              description: The answer must follow a publish or a hide within seconds.
              schema:
                type: string
              example: no-store
            X-Robots-Tag:
              description: No person route is ever indexed.
              schema:
                type: string
              example: noindex
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageVersion'
              examples:
                published:
                  summary: A published page
                  value:
                    schemaVersion: 1
                    pid: 7k2m9xq4tpz3r8vd
                    versionId: pgv_vg0hnfg53ns86tr52cs6pxetbg
        '404':
          description: |
            No public contributor page has this id — unknown, hidden, deleted, erased, replaced by
            a new permanent link, or served from a non-production plane on production. Every one of
            them answers this same body but for its trace id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                pageNotFound:
                  summary: No public page at this id, whatever the reason
                  value:
                    error:
                      code: page_not_found
                      message: There is no public contributor page at this address.
                      traceId: 01jp4c8j5tv9x3df1y6b0z2e4h
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

  /cards/p/{cardFile}:
    get:
      operationId: getContributorPageCard
      summary: The card of one contributor page (PNG)
      description: |
        The image a person embeds in a README, on a website or in a signature, and the page's
        link-preview image (D116 item 1). It follows the page: it shows only what the page shows
        and the person's card switches allow — the picture, the name, the verified login, one
        summary line, one adopter line and up to five platform marks — and never a figure, a
        status or a QR code. The render job draws it from the published page document, and this
        route serves the files that document names, through the live document only.

        Five files per page: `{pid}.png` (480×160, for Markdown), `{pid}@2x.png` (960×320, for
        HTML), `{pid}-dark.png` and `{pid}-dark@2x.png` (for `<picture>` in dark mode), and
        `{pid}-og.png` (1200×630, the page's `og:image`, addressed with `?v=`).

        **An unknown, hidden, deleted or erased page, or a wrong `v`, answers `200` with one neutral
        image**, the same bytes in every case ("This contributor page is not public"), so no embed
        ever shows a broken image and no probe tells a withdrawn page from one that never existed.
        Only a file name of none of the five shapes is a `404`.

        **A public page whose card is not drawn yet, or whose card cannot be read (an outage),
        answers a `302` to the site's generic card**, `no-store`. That card asserts nothing about
        the page; the neutral image would call a public page not public, and an outage knows
        nothing either way. The drawn card replaces the redirect as soon as the page document names
        it (`contributor-page.v1` `card.h16`).
      tags: [contributor-pages]
      x-psn-phase: P-M3
      parameters:
        - name: cardFile
          in: path
          required: true
          description: The page's permanent id followed by one of the five card suffixes.
          schema:
            type: string
            pattern: '^[0-9a-hjkmnp-tv-z]{16}(?:(?:-dark)?(?:@2x)?|-og)\.png$'
          example: 7k2m9xq4tpz3r8vd@2x.png
        - name: v
          in: query
          required: false
          description: >-
            The first eight hex characters of the card's file id, which the page's `og:image` URL
            carries so that a link-preview cache fetches again after the card changes. A value that
            is not the current one answers the neutral image.
          schema:
            type: string
            pattern: '^[0-9a-f]{8}$'
          example: 78169a78
      responses:
        '200':
          description: |
            The card, or the neutral image. Cached `max-age=300, s-maxage=3600,
            stale-while-revalidate=600` and never `stale-if-error`, so a hidden page's card is not
            kept alive by an outage, and purged on production at every publish, hide, rename, new
            permanent link and erasure. Sent with `X-Robots-Tag: noindex`,
            `Access-Control-Allow-Origin: *` and `Cross-Origin-Resource-Policy: cross-origin` (so the
            dashboard can hand the file to the phone's share sheet) and
            `Content-Security-Policy: default-src 'none'; sandbox`.
          headers:
            Cache-Control:
              schema:
                type: string
              example: max-age=300, s-maxage=3600, stale-while-revalidate=600
            X-Robots-Tag:
              schema:
                type: string
              example: noindex
          content:
            image/png:
              schema:
                type: string
                contentMediaType: image/png
        '302':
          description: |
            The page is public and its card is not drawn yet, or the card could not be read (an
            outage): a redirect to the site's generic 1200×630 card, on the site host of the
            deployment. It asserts nothing about the page. `no-store`, so the drawn card replaces it
            as soon as the page document names it; the location is fixed and never built from the
            request.
          headers:
            Location:
              schema:
                type: string
                format: uri
              example: https://purposesource.org/brand/og-generic-1200x630.png
            Cache-Control:
              schema:
                type: string
              example: no-store
            X-Robots-Tag:
              schema:
                type: string
              example: noindex
        '404':
          description: The file name is none of the five card shapes. Nothing was read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                notACard:
                  summary: Not a card file name
                  value:
                    error:
                      code: artifact_not_found
                      message: no such card file
                      traceId: 01jp4c9k6vw0y4eg2z7c1a3f5j
        '429':
          $ref: '#/components/responses/RateLimited'

  /badge/p/{pid}.svg:
    get:
      operationId: getContributorPageBadge
      summary: The flat README badge of one contributor page (SVG)
      description: |
        A flat, 20-pixel badge that sits beside other shields in a README and links to the page's
        permanent address `https://purposesource.org/p/{pid}`. The edge draws it from the live page
        document, its words as pre-outlined glyphs, so it looks the same behind GitHub's image proxy,
        in dark mode and with no fonts. It carries no login, no figure and no point; its fixed words
        are the edge slice's.

        **Every id with no public page answers `200` with the same neutral badge, "no public
        page"** — unknown, hidden, deleted and erased alike — because a README must not show a
        broken image, and a withdrawn page must not be told apart from one that never existed. It is
        cached like the card, without `stale-if-error`, and purged with it.

        **A storage outage answers `503 artifacts_unavailable`, `no-store`**, never the neutral
        badge: "no public page" asserts that a page is not public, and a cache holding it for an
        hour would say so of pages that are. The README shows the image again when the store heals.
      tags: [contributor-pages]
      x-psn-phase: P-M3
      parameters:
        - name: pid
          in: path
          required: true
          description: The page's permanent id.
          schema:
            type: string
            pattern: '^[0-9a-hjkmnp-tv-z]{16}$'
          example: 7k2m9xq4tpz3r8vd
      responses:
        '200':
          description: The badge, or the neutral badge, sent with the `noindex` robots header.
          headers:
            X-Robots-Tag:
              schema:
                type: string
              example: noindex
          content:
            image/svg+xml:
              schema:
                type: string
                contentMediaType: image/svg+xml
        '404':
          description: The id is not a page id shape. Nothing was read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                notAPageId:
                  summary: Not a page id
                  value:
                    error:
                      code: artifact_not_found
                      message: no such badge
                      traceId: 01jp4cam7wx1z5fh3a8d2b4g6k
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

  /badge/cert/{badgeFile}:
    get:
      operationId: getCertificateBadge
      summary: The README badges of one certificate (SVG, and the shields.io endpoint body)
      description: |
        The badges a certificate's holder embeds beside the certificate's link
        (`https://purposesource.org/verify/{cid}`): a flat 20-pixel badge, `{cid}.svg`; a 420×88 card
        badge in a light and a dark version, `{cid}-card.svg` and `{cid}-card-dark.svg` (for
        `<picture>` with `prefers-color-scheme`); and the same words as a shields.io endpoint body,
        `{cid}.json` (`badge.v1`). The edge draws each from the certificate's published record
        (`certificate-record.v1`) on every cache miss, with every word pre-outlined, so a badge looks
        the same behind an image proxy, in dark mode and with no fonts. Nothing is stored.

        **What a badge says is fixed words and a period, and nothing a record withholds.** A
        contributor's certificate shown in full (its record's `disclosure` is `full` or absent) and
        logged (its record carries its transparency-log position `ct`, `seq` and `segment`) says
        `credited {years}`, and its card reads
        `Credited contributor` over `Purpose Source · {years} · {n} projects` (`1 project` for
        one), the number of projects it credits. Logged and recorded status-only, or with any other
        `disclosure`, it says `verified {years}`,
        and its card reads `Purpose Source` over `verified · {years}` (`verified` alone when the
        period does not read): no headline, no count and no rosette. A badge names nobody, so anyone can embed anyone's; `Credited contributor` is drawn
        only on a card whose verify page names the holder, and a status-only record's cannot, so its
        card says nothing more than its flat badge does (ops decision D137 item 4). `{years}` is the
        period's year or its first and last year (`2025–2026`). Every card's last line is
        `Live status from purposesource.org`. A revoked certificate says `revoked`, a superseded one
        `updated, see new`, and a certificate signed with a non-production key says `test` (served
        off production only). No badge carries a name, a login, a project name, a figure or a point.
        The card of a certificate shown in full draws the certificate's rosette, a pattern from the
        token's public hash: it is decoration, and it proves nothing.

        **A certificate that is not published answers like one that never existed:** an unknown
        identifier, a malformed one, and any certificate whose record was erased (a revocation at
        the subject's request, whatever the certificate's class) all answer `200` with the same
        `not found` badge, the same bytes for every one of them (the `.json` body carries
        `isError: true`), so a README never shows a broken image and no probe tells them apart.

        **A badge never claims more than its verify page:** a contributor's certificate whose record
        carries no transparency-log position (`ct` null or absent, or without an integer `seq` and
        `segment`, each at least 0) answers the same `not found` badge as an unknown certificate,
        the same bytes, whatever its status and display, because its verify page says it is not
        verified. A certificate signed with a non-production key still says `test` off production.

        **An organisation's certificate has badge words in two cases only.** A listed company's
        Entitlement (a `supporter.entitlement` certificate shown in full, as its payer asked to be
        listed, and logged, as a credited contributor's must be) says the claim kit's badge words
        after the label, from the kit's
        `Purpose Source · {lane} Entitlement · {status}`: `{lane} Entitlement · verified` while its
        status is `valid` (the word for a certificate in force: no picture says "valid"), and
        `{lane} Entitlement · expired` once it is expired by the clock, where `{lane}` is `Project`,
        `Portfolio` or `Pass`, the lane its scope names. Its card reads `Purpose Source` over the same words and the live line. It is
        typographic, with no rosette, and names no organisation, band, amount or period. Every other
        organisation's certificate (an unlisted company, a waiver, a sponsor or another supporter
        variant, a person's supporter certificate, a revoked or superseded Entitlement, and an
        Entitlement with any other `disclosure` or with no log position) has no badge words yet, and
        a steward's has none at all; their badge files answer `404 artifact_not_found`
        unless the record was erased. A file name of none of the four shapes answers the same `404`
        and reads nothing.

        **A non-production plane, or a non-production key, on production answers
        `400 sandbox_artifact_on_prod`**, as the certificate record's route does: a production
        hostname never draws a fictional badge. **A storage outage answers `503`, `no-store`**,
        never `not found`, which would assert something an outage cannot know.
      tags: [badges]
      x-psn-phase: P-M3
      parameters:
        - name: badgeFile
          in: path
          required: true
          description: >-
            The certificate's id followed by one of the four badge shapes: `.svg`, `-card.svg`,
            `-card-dark.svg` or `.json`. An id that is not a certificate id answers as an unknown one
            does, without a read.
          schema:
            type: string
            pattern: '^cert_[0-9a-hjkmnp-tv-z]{26}(?:\.svg|-card\.svg|-card-dark\.svg|\.json)$'
          example: cert_01jf8w2c9km3q7xz5r0v4t6y8a-card.svg
      responses:
        '200':
          description: |
            The badge, as SVG for the three image shapes and as a `badge.v1` body for `.json`;
            `not found` for every certificate that is not published, and for a contributor's
            certificate whose record carries no transparency-log position. Cached `max-age=300,
            s-maxage=3600, stale-while-revalidate=86400, stale-if-error=604800`: production purges
            them whenever the certificate's card changes, and any other change shows within about an
            hour, or later while the edge answers errors (a shared cache may then keep the last good
            badge for up to a week). Sent with
            `X-Robots-Tag: noindex` (a certificate may be a person's), `Access-Control-Allow-Origin: *`,
            `Cross-Origin-Resource-Policy: cross-origin` and, on the images,
            `Content-Security-Policy: default-src 'none'; sandbox`.
          headers:
            Cache-Control:
              schema:
                type: string
              example: max-age=300, s-maxage=3600, stale-while-revalidate=86400, stale-if-error=604800
            X-Robots-Tag:
              schema:
                type: string
              example: noindex
          content:
            image/svg+xml:
              schema:
                type: string
                contentMediaType: image/svg+xml
            application/json:
              schema:
                $ref: '../schemas/badge.v1.json'
              examples:
                credited:
                  summary: A contributor's certificate shown in full
                  value:
                    schemaVersion: 1
                    label: purpose source
                    message: credited 2026
                    color: '#1d5c3c'
                    cacheSeconds: 3600
                verified:
                  summary: A contributor's certificate recorded status-only, over two calendar years
                  value:
                    schemaVersion: 1
                    label: purpose source
                    message: verified 2025–2026
                    color: '#1d5c3c'
                    cacheSeconds: 3600
                revoked:
                  summary: A revoked certificate
                  value:
                    schemaVersion: 1
                    label: purpose source
                    message: revoked
                    color: '#8a1f1f'
                    cacheSeconds: 3600
                entitlement:
                  summary: A listed company's Project Entitlement in force
                  value:
                    schemaVersion: 1
                    label: purpose source
                    message: Project Entitlement · verified
                    color: '#1d5c3c'
                    cacheSeconds: 3600
                entitlementExpired:
                  summary: A listed company's Pass Entitlement, expired by the clock
                  value:
                    schemaVersion: 1
                    label: purpose source
                    message: Pass Entitlement · expired
                    color: '#45505c'
                    cacheSeconds: 3600
                notFound:
                  summary: No published certificate with this id, whatever the reason, or a contributor's certificate with no log position — 200 with an error-shaped body
                  value:
                    schemaVersion: 1
                    isError: true
                    label: purpose source
                    message: not found
                    color: '#45505c'
                    cacheSeconds: 3600
        '400':
          description: The certificate is on a non-production plane, or signed with a non-production key, and this is production.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                sandboxOnProd:
                  summary: Fixture material behind a production hostname
                  value:
                    error:
                      code: sandbox_artifact_on_prod
                      message: This deployment serves production material only.
                      traceId: 01jp4cbn8xy2a6gj4b9e3c5h7m
        '404':
          description: |
            The file name is none of the four badge shapes (nothing was read), or the certificate is
            a steward's or an organisation's other than a listed company's logged Entitlement in force
            or expired by the clock, for which no badge words are drawn, and its record was not erased.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                noBadge:
                  summary: Not a badge file, or no badge words for this certificate
                  value:
                    error:
                      code: artifact_not_found
                      message: no such badge
                      traceId: 01jp4ccp9yz3b7hk5c0f4d6j8n
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ArtifactsUnavailable'

  /badge/repo/{badgeFile}:
    get:
      operationId: getRepositoryBadge
      summary: The README badges and README cards of one repository (SVG)
      description: |
        The repository badge's own look, drawn by the edge with every word pre-outlined: a flat
        20-pixel badge, `{nodeId}.svg`, and a 420×88 card badge in a light and a dark version,
        `{nodeId}-card.svg` and `{nodeId}-card-dark.svg`. They link to the repository's registry page
        and say what the shields.io endpoint `/badge/{nodeId}.json` says, from the same published
        badge artifact and the same delist set: `registered`, the neutral `status: see registry`
        for a suspended, quit or delisted repository (a stale artifact never keeps asserting
        registration), and `not registered` for an unknown id, at `200` so a README never shows a
        broken image. The card adds the repository's name and licence version from its published
        registry record while it is registered. Text only, with no mark: repositories are what
        organisations display. The shields.io endpoint stays as it is, beside these.

        A storage outage answers the neutral badge, which asserts nothing, as the endpoint does.

        **The README cards** (ops decisions D150, D151 and D154) are the two pictures Purpose Source's
        adoption pull request writes into a README, twelve names per repository: the top form,
        `{nodeId}-top.svg`, 440×84, for the top of a README, and the full card,
        `{nodeId}-showcase.svg`, 440×255 (440×233 without its line on contributor certificates), for
        its License section; each with Purpose Source's mark (no further suffix), with the repository
        owner's GitHub picture (`-picture`) or with no icon (`-noicon`), and each in a dark version too
        (`-dark`): `{nodeId}-(top|showcase)(-picture|-noicon)?(-dark)?.svg`. A card says what the
        badge decides, from the same two reads. A registered repository's card draws its owner and
        name from its published registry record, the licence's name, and, on the full card, the
        licence's version and the month the repository became registered. A suspended, quit or
        delisted repository, an outage, and a registered repository whose record cannot be read get
        the slim neutral strip "Status: see the registry page" (440×56), which asserts nothing; an
        unknown id gets the strip "Shows here once this repository is registered", at `200` so a
        README never shows a broken image. The owner's picture is fetched by the edge from GitHub by
        the record's owner id and embedded in the card, which is drawn without it when GitHub does not
        give it or the owner objected to it. The README cards may carry Purpose Source's mark, only
        beside the words "Purpose Source License" (ops decision D151 item 2): the one exception to the
        text-only rule above.

        **The cards are served only where the deployment's README card switch is on, and production's
        is off.** Where it is off, a card name is read as before the cards existed: as the flat badge
        of a node id that ends in the card's suffix, which answers `not registered` for an id in the
        current form and `400 invalid_repo_id` for a legacy one. Nothing should embed a card before
        its deployment serves them: the adoption pull request writes none until then, and the badge
        kits offer none.
      tags: [badges]
      x-psn-phase: P-M2
      parameters:
        - name: badgeFile
          in: path
          required: true
          description: >-
            The repository's GitHub node id, in either form GitHub has issued (`%3D` is read as `=`),
            followed by `.svg`, `-card.svg` or `-card-dark.svg`, or by one of the twelve README card
            suffixes, `-(top|showcase)(-picture|-noicon)?(-dark)?.svg`. A value that is not a repository
            node id answers `400 invalid_repo_id` before any read. A node id that itself ends in `-card`
            is read as the card of the shorter id, and, where the README cards are served, one that ends
            in a card's suffix is read as that card of the shorter id.
          schema:
            type: string
            pattern: '^([A-Za-z0-9_-]{4,128}|MDEwOlJlcG9zaXRvcnk[A-Za-z0-9+/=]{1,96})(?:\.svg|-card\.svg|-card-dark\.svg|-(?:top|showcase)(?:-picture|-noicon)?(?:-dark)?\.svg)$'
          example: R_kgDOAbc123-card.svg
      responses:
        '200':
          description: |
            The badge (SVG), including the neutral and the unknown forms. Cached `max-age=300,
            s-maxage=3600, stale-while-revalidate=86400, stale-if-error=604800`, like the shields.io
            endpoint. A README card is cached the same way, but for two cases: the strip for an
            unknown id, `max-age=60, s-maxage=60`, so a repository whose pull request has just been
            merged shows its card within a minute of its registration; and a card drawn without what
            it should show (the owner's picture GitHub did not give, or a record that could not be
            read), `max-age=300, s-maxage=300`, so that it heals soon.
          headers:
            Cache-Control:
              schema:
                type: string
              example: max-age=300, s-maxage=3600, stale-while-revalidate=86400, stale-if-error=604800
          content:
            image/svg+xml:
              schema:
                type: string
                contentMediaType: image/svg+xml
        '400':
          description: The value is not a repository node id, or the plane behind a production hostname is not a production plane.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalidRepoId:
                  summary: Not a repository node id
                  value:
                    error:
                      code: invalid_repo_id
                      message: A repository is identified by its GitHub node id.
                      traceId: 01jp4cdq0z04c8jm6d1g5e7k9p
        '404':
          description: The file name is none of the badge and README card shapes above. Nothing was read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                notABadge:
                  summary: Not a badge file name
                  value:
                    error:
                      code: artifact_not_found
                      message: no such badge
                      traceId: 01jp4cer1a15d9kn7e2h6f8m0q
        '429':
          $ref: '#/components/responses/RateLimited'

  /cards/{cardFile}:
    get:
      operationId: getCertificateCard
      summary: The share card of one certificate (PNG)
      description: |
        The 1200×630 card the render job drew for a certificate shown in full, which the verify
        page names as its link-preview image and the holder shares. It prints the certificate's id
        and "Issued {month}", never a live status. The edge serves the copy the platform's index
        build placed on the published plane (`cards/{cid}.png`), and only while the certificate's
        published record is shown in full (`disclosure` `full` or absent), carries its transparency-log
        position (`ct`), and is `valid`, or `expired` by the clock (one card serves
        both): a card left in storage after the holder withdrew to status-only is never served, and
        neither is the card of a revoked or superseded certificate, because the file in storage may
        still be the one drawn before its status changed. Those answer the generic card for now.

        **`v` versions the link preview.** The verify page names the card as
        `/cards/{cid}.png?v={status}-{display}-v1`, so a link-preview cache fetches again when the
        status or the display changes; production purges the bare address and every one of the
        eight values on each change of the card. The query is read as sent, never parsed: only the
        bare address and `?v=` followed by exactly one of the eight values are served a card. Any
        other query, a `v` outside them, more than one, or one of them spelled another way (`?v=…&`,
        `?%76=…`, `?v=valid%2Dfull-v1`), is never served one, so every address that can hold a card
        in a cache is one production purges. Without a purge, what shared caches answer catches up
        within about 75 minutes: up to five for the edge's own read of the record and the card, an
        hour in a shared cache, and ten more of revalidation (a link-preview service's own copy is
        beyond the edge's reach either way).

        **Every certificate without a servable card answers a `302` to the site's generic card**,
        `no-store`: a status-only, revoked, superseded or unknown certificate, a malformed id, an
        erased record, a card not drawn or not copied yet, any other query, a non-production plane on
        production, and an outage. The generic card asserts nothing about any certificate, so no
        preview ever breaks and no probe learns anything. Only a file name that is not
        `{something}.png` is a `404`.

        **Rate limit:** counted with `/v1/verify/{certId}` against the same per-address limit (the
        `verify` class of `/v1/meta`), because a card shown in full carries what the record does.
      tags: [cards]
      x-psn-phase: P-M3
      parameters:
        - name: cardFile
          in: path
          required: true
          description: The certificate's id followed by `.png`.
          schema:
            type: string
            pattern: '^cert_[0-9a-hjkmnp-tv-z]{26}\.png$'
          example: cert_01jf8w2c9km3q7xz5r0v4t6y8a.png
        - name: v
          in: query
          required: false
          description: The certificate's status and display when the link was made, and the template version.
          schema:
            type: string
            pattern: '^(?:valid|expired|revoked|superseded)-(?:full|status-only)-v1$'
          example: valid-full-v1
      responses:
        '200':
          description: |
            The card. Cached `max-age=300, s-maxage=3600, stale-while-revalidate=600` and never
            `stale-if-error`, so an outage does not keep a withdrawn card alive, and purged on
            production at every status or display change. Sent with `X-Robots-Tag: noindex`,
            `Access-Control-Allow-Origin: *` and `Cross-Origin-Resource-Policy: cross-origin` (the
            dashboard hands it to the phone's share sheet) and
            `Content-Security-Policy: default-src 'none'; sandbox`.
          headers:
            Cache-Control:
              schema:
                type: string
              example: max-age=300, s-maxage=3600, stale-while-revalidate=600
            X-Robots-Tag:
              schema:
                type: string
              example: noindex
          content:
            image/png:
              schema:
                type: string
                contentMediaType: image/png
        '302':
          description: |
            No card is served for this request: a redirect to the site's generic 1200×630 card on the
            site host of the deployment, `no-store`. The location is fixed and never built from the
            request.
          headers:
            Location:
              schema:
                type: string
                format: uri
              example: https://purposesource.org/brand/og-generic-1200x630.png
            Cache-Control:
              schema:
                type: string
              example: no-store
        '404':
          description: The file name is not a card file. Nothing was read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                notACard:
                  summary: Not a card file name
                  value:
                    error:
                      code: artifact_not_found
                      message: no such card file
                      traceId: 01jp4cfs2b26e0mp8f3j7g9n1r
        '429':
          $ref: '#/components/responses/RateLimited'

  /cards/repo/{cardFile}:
    get:
      operationId: getRepositoryCard
      summary: The project card of one repository (PNG)
      description: |
        The repository's project card, typographic and with no mark: `{nodeId}.png` (1200×630, the
        registry page's link-preview image) and `{nodeId}-github.png` (1280×640, for GitHub's
        social preview). The edge serves the copies the platform's index build places on the
        published plane, `cards/repo/{nodeId}.png` and `cards/repo/{nodeId}-github.png`.

        A card is served only while the repository's badge says `registered`, decided as
        `/badge/{nodeId}.json` decides it. **Every repository without a servable card answers a
        `302` to the site's generic card**, `no-store`, so a preview never breaks: a card not drawn
        or not copied yet, a suspended, quit or delisted repository, an id with no published badge
        (never registered, or removed), whatever card is in storage (a stale card never keeps
        asserting registration), a non-production plane on production, and an outage. Until the
        index build copies repository cards, every repository answers it.
      tags: [cards]
      x-psn-phase: P-M3
      parameters:
        - name: cardFile
          in: path
          required: true
          description: >-
            The repository's GitHub node id followed by `.png` or `-github.png`. A value that is not a
            repository node id answers `400 invalid_repo_id` before any read.
          schema:
            type: string
            pattern: '^([A-Za-z0-9_-]{4,128}|MDEwOlJlcG9zaXRvcnk[A-Za-z0-9+/=]{1,96})(?:-github)?\.png$'
          example: R_kgDOAbc123.png
      responses:
        '200':
          description: |
            The card. Cached `max-age=300, s-maxage=3600, stale-while-revalidate=600`, with
            `Access-Control-Allow-Origin: *`, `Cross-Origin-Resource-Policy: cross-origin` and
            `Content-Security-Policy: default-src 'none'; sandbox`. A repository's card is a registry
            fact and carries no robots header on production.
          headers:
            Cache-Control:
              schema:
                type: string
              example: max-age=300, s-maxage=3600, stale-while-revalidate=600
          content:
            image/png:
              schema:
                type: string
                contentMediaType: image/png
        '302':
          description: No card is served for this repository, so this redirects to the site's generic card, `no-store`.
          headers:
            Location:
              schema:
                type: string
                format: uri
              example: https://purposesource.org/brand/og-generic-1200x630.png
            Cache-Control:
              schema:
                type: string
              example: no-store
        '400':
          description: The value is not a repository node id. Nothing was read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalidRepoId:
                  summary: Not a repository node id
                  value:
                    error:
                      code: invalid_repo_id
                      message: A repository is identified by its GitHub node id.
                      traceId: 01jp4cgt3c37f1nq9g4k8h0p2s
        '404':
          description: The file name is not a repository card file. Nothing was read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                notACard:
                  summary: Not a card file name
                  value:
                    error:
                      code: artifact_not_found
                      message: no such card file
                      traceId: 01jp4chv4d48g2pr0h5m9j1q3t
        '429':
          $ref: '#/components/responses/RateLimited'

  /stats.json:
    get:
      operationId: getStats
      summary: Public counters
      description: |
        The counters shown on the site, with an explicit three-state machine so that a
        missing number is a documented state rather than a bug.

        In `pre-launch` every numeric field is `null`. In `launched-pre-disbursement` the
        registry counts are real while the money figure stays `null` and
        `firstDisbursementScheduledFor` names the date. Only in `post-first-franc` is the
        money figure a number. "CHF 0" is never rendered — not as an achievement and not
        as an embarrassment.

        `state` is computed from real registry and ledger facts and is never set by hand.
      tags: [counters]
      x-psn-phase: P-M2
      responses:
        '200':
          description: The counters. Regenerated daily, cached 3600 s.
          content:
            application/json:
              schema:
                $ref: '../schemas/stats.v1.json'
              examples:
                preLaunch:
                  summary: Before launch — mechanism copy only
                  value:
                    schemaVersion: 1
                    generatedAt: '2026-09-01T05:00:00Z'
                    state: pre-launch
                    projectsRegistered: null
                    contributorsClaimed: null
                    companiesCovered: null
                    chfRoutedMinor: null
                    cur: CHF
                    firstDisbursementScheduledFor: null
                    loi: null
                    smallnessThresholds:
                      projects: 25
                      contributors: 50
                      companies: 10
                launched:
                  summary: Launched, before the first disbursement
                  value:
                    schemaVersion: 1
                    generatedAt: '2027-04-01T05:00:00Z'
