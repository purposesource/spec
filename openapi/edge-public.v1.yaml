                        month: 2027-06
                        seq: 1
                        type: pool-in
                        date: '2027-06-01'
                        amountMinor: 36000
                        currency: CHF
                        srcAmountMinor: 40000
                        srcCurrency: USD
                        fxRate: '0.9'
                        fxSource: ECB daily
                        fxDate: '2027-06-01'
                        repoNodeId: R_kgDOAbc123
                        entId: ent_01jh0y4e1np5s9zb7t2x6v8a1d
                        coId: co_01jh0y4e1np5s9zb7t2x6v8a0d
                        lane: project
                        holdStatus: open-M+1
                        payerName: unnamed
                        scheduleVersion: v1
